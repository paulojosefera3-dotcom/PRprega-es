{keys:["familia","pais","filhos","casamento","relacionamento"],text:"Colossenses 3:12-21",goal:"Promover cuidado, respeito e responsabilidade nas relações familiares.",ctx:"Colossenses 3 reúne orientações para a vida comunitária e doméstica no contexto antigo. Leia a passagem considerando todo o seu entorno e aplique seus princípios com dignidade, reciprocidade e segurança para todas as pessoas.",refs:"Colossenses 3:12-21; Deuteronômio 6:4-9; Efésios 4:1-3.",ill:"Use uma situação familiar hipotética em que uma conversa muda quando cada pessoa escuta sem interromper e combina uma responsabilidade concreta.",topics:[["Pratique compaixão dentro de casa","O cuidado começa por perceber a necessidade do outro. Convide a refletir sobre escuta, presença e respeito nas rotinas comuns."],["Construa relações com paciência e verdade","Paciência não é licença para violência ou humilhação. Destaque limites saudáveis, reciprocidade e procura de ajuda quando houver risco."],["Transforme valores em hábitos","Pequenos compromissos repetidos ajudam a família: refeições partilhadas, pedidos de perdão, divisão justa de tarefas e momentos de conversa."]] },
{keys:["sabedoria","escolhas","proposito"],text:"Tiago 1:5-8",goal:"Estimular decisões sábias, refletidas e coerentes com a fé.",ctx:"Tiago 1 fala sobre provações, perseverança e pedido de sabedoria. Leia o trecho inteiro e conecte a orientação sobre sabedoria ao contexto da carta.",refs:"Tiago 1:5-8; Provérbios 3:5-6; Romanos 12:2.",ill:"Imagine uma pessoa diante de uma decisão importante que reúne informações, pede conselho confiável, considera consequências e ora antes de agir.",topics:[["Admita os limites do próprio entendimento","Buscar sabedoria começa com humildade. Convide a identificar decisões em que pressa, medo ou orgulho podem distorcer a avaliação."],["Peça sabedoria e procure conselho","O texto incentiva pedir sabedoria. Relacione oração com leitura, conversa com pessoas maduras e atenção às consequências para os envolvidos."],["Aja com coerência e responsabilidade","Uma decisão sábia leva a uma ação. Proponha escolher um passo reversível e seguro, avaliar seus frutos e corrigir a rota quando necessário."]] },
{keys:["servico","servir","missao","proximo","generosidade"],text:"Marcos 10:42-45",goal:"Inspirar serviço humilde e cuidado prático com o próximo.",ctx:"Em Marcos 10, Jesus contrasta domínio com serviço e apresenta sua própria missão como referência. Leia a conversa completa para entender a correção feita aos discípulos.",refs:"Marcos 10:42-45; Gálatas 6:9-10; 1 Pedro 4:10.",ill:"Conte uma cena hipotética de alguém que percebe uma necessidade prática e se organiza com outras pessoas para ajudar de modo respeitoso.",topics:[["Reavalie o que significa grandeza","Jesus questiona a busca por posição e controle. Ajude o público a perceber como autoridade pode ser usada para proteger e servir."],["Sirva sem apagar a dignidade de ninguém","Serviço não é exploração nem busca de reconhecimento. Enfatize consentimento, respeito e parceria com quem recebe ajuda."],["Organize o cuidado para que ele continue","A compaixão pode virar ação planejada: ouvir a comunidade, dividir responsabilidades e acompanhar os resultados."]] },
{keys:["perseveranca","sofrimento","prova","tribulacao","dificuldade"],text:"Tiago 1:2-4",goal:"Apoiar a perseverança sem minimizar o sofrimento vivido.",ctx:"Tiago 1 trata de provações e perseverança. Leia a carta reconhecendo que o texto não chama o sofrimento de bom nem dispensa cuidado e apoio.",refs:"Tiago 1:2-4; Romanos 5:3-5; Hebreus 12:1-3.",ill:"Imagine uma pessoa que enfrenta um processo longo e aprende a dividir o caminho em etapas, buscando companhia e ajuda adequada.",topics:[["Não esconda a dificuldade","A fé permite falar de sofrimento com honestidade. Não culpe quem sofre nem prometa que toda situação terá uma solução imediata."],["Procure apoio para continuar","Perseverança pode incluir descanso, comunidade, tratamento e ajuda prática. Mostre que pedir ajuda não é falta de fé."],["Reconheça o crescimento sem romantizar a dor","O texto aponta para maturidade, mas isso não transforma injustiça em algo desejável. Convide a observar sinais de cuidado e passos possíveis."]] }
,{keys:["salmo 23","salmos 23","pastor","cuidado de deus","proteção","proteção de deus"],text:"Salmos 23:1-6",goal:"Apresentar a confiança em Deus usando as imagens de cuidado, presença e acolhimento do salmo.",ctx:"Salmos 23 é um poema de confiança que retrata o Senhor como pastor e anfitrião. As imagens passam por pastagens, águas, um vale escuro, uma mesa e a casa do Senhor. O vale continua presente: a confiança do salmo está na companhia de Deus durante o perigo, não numa promessa de que a pessoa nunca sofrerá.",refs:"Salmos 23:1-6; João 10:11-16; 1 Pedro 2:25.",ill:"Se usar uma ilustração, deixe claro que é hipotética: alguém atravessa uma situação difícil acompanhado por uma pessoa confiável, sem que a dificuldade desapareça imediatamente.",topics:[["O cuidado que orienta","Observe a imagem do pastor e os verbos usados nos versículos 1-3. Mostre o que o próprio poema afirma sobre cuidado e direção, sem transformar a imagem numa promessa de prosperidade material."],["A presença no vale","Nos versículos 4-5, o vale e os inimigos não são apagados. Destaque que a confiança aparece junto da vulnerabilidade e do perigo."],["A esperança que acompanha a caminhada","O final do salmo aponta para bondade, misericórdia e comunhão com Deus. Convide a comunidade a responder com confiança, cuidado mútuo e esperança realista."]] },{keys:["salvação","salvacao","vida eterna","novo nascimento"],text:"João 3:1-21",goal:"Apresentar o diálogo de Jesus com Nicodemos e o convite à vida que vem de Deus.",ctx:"João 3 começa com Nicodemos, fariseu e líder entre os judeus, procurando Jesus à noite. A conversa trata de nascer de novo/do alto, da ação do Espírito e da resposta à luz. Leia a unidade até o versículo 21: o versículo 16 faz parte de um argumento maior, não é uma frase isolada.",refs:"João 3:1-21; João 1:9-13; 1 João 4:9-10.",ill:"Uma ilustração pode mostrar mudança de perspectiva, mas deixe claro que nenhuma experiência humana explica por completo a imagem do novo nascimento.",topics:[["Leia o diálogo no contexto","Observe a pergunta de Nicodemos e como Jesus responde. Não reduza o novo nascimento a uma fórmula ou a uma experiência única descrita por todos do mesmo modo."],["Observe o alcance do amor de Deus","Os versículos 16-17 enfatizam o envio do Filho e a salvação. Leia também os versículos seguintes, que falam da resposta à luz."],["Responda à luz com fé","O trecho relaciona crer, vida e verdade. Convide a uma resposta sincera sem usar condenação ou pressão emocional."]] }
,{keys:["graça","salvo pela graça","boas obras","misericordia"],text:"Efésios 2:1-10",goal:"Explicar a salvação como dádiva da graça que conduz a uma vida de boas obras.",ctx:"Efésios 2:1-10 contrasta a antiga condição descrita nos versículos 1-3 com a ação misericordiosa de Deus nos versículos 4-7. Os versículos 8-10 unem salvação pela graça, recebida mediante a fé, e uma vida criada para boas obras. O texto não apresenta as obras como preço da salvação.",refs:"Efésios 2:1-10; Romanos 3:21-26; Tito 3:4-8.",ill:"Se usar uma ilustração de presente, explique também seus limites: a metáfora ajuda a falar de dádiva, mas o texto prossegue falando de uma vida transformada.",topics:[["Reconheça a condição anterior","Leia os versículos 1-3 e observe como o texto descreve a necessidade humana. Evite usar essa descrição para humilhar pessoas."],["Destaque a iniciativa graciosa de Deus","Nos versículos 4-9, a ênfase está na misericórdia e na graça, não em mérito humano."],["Mostre o propósito de uma vida transformada","O versículo 10 fala de boas obras como caminho preparado para a vida, não como pagamento pela salvação."]] }
,{keys:["discipulado","seguir jesus","tomar a cruz","renuncia"],text:"Marcos 8:27-38",goal:"Refletir sobre seguir Jesus com fidelidade, discernimento e disposição para servir.",ctx:"Marcos 8:27-38 situa o ensino sobre tomar a cruz após a confissão de Pedro e a primeira previsão da paixão. Jesus corrige a compreensão triunfalista do messianismo e fala aos discípulos e à multidão sobre segui-lo.",refs:"Marcos 8:27-38; Marcos 10:42-45; Lucas 9:23-26.",ill:"Use um exemplo de escolha responsável e custosa, sem comparar sofrimento voluntário com aceitar violência, exploração ou abuso.",topics:[["Pergunte quem Jesus é","A conversa começa com as respostas das pessoas e a confissão de Pedro. Leia também a correção que vem logo depois."],["Entenda o caminho da cruz no contexto","Jesus anuncia sofrimento e rejeição antes de falar sobre tomar a cruz. Não transforme esse chamado em justificativa para permanecer em perigo ou suportar abuso."],["Considere o custo e o propósito de seguir","O texto contrasta ganhar o mundo com perder a vida. Convide a refletir sobre prioridades, fidelidade e serviço."]] }
,{keys:["gratidão","agradecimento","dar graças"],text:"1 Tessalonicenses 5:12-22",goal:"Praticar gratidão junto com oração, discernimento e cuidado comunitário.",ctx:"1 Tessalonicenses 5:12-22 reúne instruções finais dirigidas à comunidade: cuidado mútuo, oração, gratidão e discernimento. O versículo 18 orienta a dar graças em todas as circunstâncias; isso não significa chamar o mal de bom ou agradecer pela violência sofrida.",refs:"1 Tessalonicenses 5:12-22; Filipenses 4:4-9; Salmos 107:1-9.",ill:"Convide a comunidade a nomear motivos concretos de gratidão sem silenciar perdas, luto ou injustiça.",topics:[["Pratique gratidão sem negar a realidade","Leia o versículo 18 junto dos demais conselhos. Gratidão e lamento podem coexistir."],["Viva a gratidão em comunidade","Os versículos ao redor falam de respeito, paciência, apoio e paz entre as pessoas."],["Una oração a discernimento","O trecho também pede que se examine tudo e se retenha o que é bom. Gratidão não exige aceitar qualquer ensino ou situação."]] }
,{keys:["justiça","misericórdia","retidão","praticar o bem"],text:"Miqueias 6:1-8",goal:"Relacionar adoração a uma vida de justiça, misericórdia e humildade.",ctx:"Miqueias 6:1-8 usa a forma de uma disputa/protesto profético: o povo é chamado a recordar a ação de Deus e pergunta o que deve apresentar. O versículo 8 resume a resposta em praticar a justiça, amar a misericórdia e andar humildemente com Deus; não é uma dispensa de toda adoração, mas uma crítica à religião desligada da vida.",refs:"Miqueias 6:1-8; Isaías 1:10-17; Amós 5:21-24.",ill:"Apresente um caso hipotético em que uma comunidade precise ouvir pessoas afetadas por uma decisão e corrigir uma prática injusta.",topics:[["Escute a denúncia profética","Leia os versículos 1-5 e observe a memória das ações de Deus que fundamenta o chamado."],["Perceba a crítica ao ritual sem vida justa","Os versículos 6-7 perguntam sobre ofertas; a resposta seguinte aponta para a vida ética e relacional."],["Pratique justiça, misericórdia e humildade","Trate as três expressões juntas. A aplicação inclui decisões concretas, cuidado com o próximo e disposição para corrigir o próprio caminho."]] }
,{keys:["espirito santo","pentecostes","dons espirituais"],text:"Atos 2:1-21",goal:"Estudar o relato de Pentecostes e o testemunho público capacitado pelo Espírito.",ctx:"Atos 2 narra a vinda do Espírito no Pentecostes, quando os discípulos reunidos falam e pessoas de diferentes regiões ouvem em suas próprias línguas. Pedro interpreta o acontecimento à luz do profeta Joel. Leia o episódio inteiro, incluindo a reação da multidão e a continuação do discurso.",refs:"Atos 2:1-21; Joel 2:28-32; Atos 1:6-8.",ill:"Uma ilustração sobre comunicação entre culturas pode ajudar, mas não substitui o sinal narrado no texto.",topics:[["Observe o cenário e os ouvintes","Os versículos 1-13 destacam a reunião, o fenômeno e a diversidade de quem ouve. Leia a lista de povos antes de resumir o episódio."],["Leia a interpretação de Pedro","Nos versículos 14-21, Pedro relaciona o acontecimento à profecia de Joel. Distinga a citação bíblica da explicação do pregador."],["Relacione o Espírito ao testemunho","Leia a ligação com Atos 1:8 e o restante de Atos 2. Evite afirmar que uma experiência individual esgota o significado do capítulo."]] }
,{keys:["ressurreição","ressuscitou","vida após a morte"],text:"1 Coríntios 15:12-28",goal:"Compreender por que a ressurreição de Cristo é central para a esperança cristã.",ctx:"Em 1 Coríntios 15, a carta responde a uma questão sobre a negação da ressurreição dos mortos. Nos versículos 12-28, Paulo apresenta consequências dessa negação e descreve Cristo como primícias dos que morreram, relacionando a esperança futura à vitória sobre a morte.",refs:"1 Coríntios 15:12-28; 1 Tessalonicenses 4:13-18; João 11:17-27.",ill:"Uma ilustração pode falar de esperança diante do luto, sem fingir que elimina a dor ou substitui o argumento do texto.",topics:[["Entenda a pergunta enfrentada","Leia 1 Coríntios 15:12-19 para perceber por que a ressurreição dos mortos está em discussão."],["Observe Cristo como primícias","Nos versículos 20-23, a imagem conecta a ressurreição de Cristo à esperança dos que lhe pertencem."],["Veja o horizonte da vitória sobre a morte","Os versículos 24-28 apontam para o fim da morte e para o reinado de Cristo. Não reduza a esperança a sucesso imediato nesta vida."]] }
,{keys:["generosidade","oferta","dinheiro na igreja","contribuição"],text:"2 Coríntios 8:1-15",goal:"Encorajar generosidade voluntária, solidária e responsável.",ctx:"2 Coríntios 8 trata da coleta organizada por Paulo em favor dos cristãos necessitados de Jerusalém. O exemplo das igrejas da Macedônia aparece junto ao apelo à generosidade de Corinto. Os versículos 8 e 12-15 falam de disposição e equilíbrio; o texto não deve ser usado para coagir pessoas ou prometer enriquecimento.",refs:"2 Coríntios 8:1-15; 2 Coríntios 9:6-11; Atos 11:27-30.",ill:"Use uma situação comunitária concreta de ajuda transparente, com prestação de contas e respeito à capacidade de cada pessoa.",topics:[["Veja a necessidade atendida","Leia o capítulo no contexto da coleta para os pobres em Jerusalém, não como fórmula para obter retorno financeiro."],["Observe a disposição voluntária","O texto destaca prontidão e proporção, sem transformar contribuição em coerção."],["Busque equilíbrio e responsabilidade","Os versículos 13-15 falam de igualdade e cuidado mútuo. Aplique com transparência e prestação de contas."]] }
,{keys:["riqueza","avareza","ganancia","prosperidade financeira"],text:"Lucas 12:13-21",goal:"Questionar a ganância e refletir sobre o uso responsável dos bens.",ctx:"Em Lucas 12:13-21, alguém pede que Jesus intervenha numa disputa de herança. Jesus alerta contra a ganância e conta a parábola do rico que acumula colheitas, mas morre antes de desfrutar seus planos. O foco é a falsa segurança da acumulação e a relação com Deus, não a afirmação de que toda pessoa que possui bens seja má.",refs:"Lucas 12:13-21; Lucas 16:19-31; 1 Timóteo 6:17-19.",ill:"Apresente um exemplo hipotético de alguém que planeja financeiramente sem reduzir a vida a consumo, status ou acúmulo.",topics:[["Leia a situação que provoca a parábola","O pedido sobre herança e a resposta de Jesus nos versículos 13-15 explicam o assunto."],["Observe a falsa segurança do rico","O personagem planeja ampliar seus depósitos, mas não considera os limites da vida nem sua relação com Deus."],["Pergunte para que os bens serão usados","O versículo 21 contrasta acumular para si com ser rico para com Deus. Inclua generosidade e responsabilidade sem condenar automaticamente quem tem recursos."]] }
,{keys:["direção de deus","orientacao","caminho","decisão","decisao"],text:"Provérbios 3:1-12",goal:"Buscar sabedoria, confiança e orientação sem tratar provérbios como garantias automáticas.",ctx:"Provérbios 3:1-12 faz parte de instruções de sabedoria dirigidas como ensino de um pai ou mestre. Os versículos 5-6 aconselham confiar no Senhor e reconhecê-lo nos caminhos. Como literatura sapiencial, o trecho oferece orientação para a vida, não uma promessa de que toda decisão será fácil ou terá resultado previsível.",refs:"Provérbios 3:1-12; Tiago 1:5-8; Salmos 37:3-7.",ill:"Imagine uma decisão em que oração, conselho confiável, informação e consideração das consequências caminham juntos.",topics:[["Receba a instrução como caminho de sabedoria","Leia os versículos 1-4 e observe os valores que acompanham a confiança."],["Confie sem abandonar o discernimento","Os versículos 5-6 convidam à confiança e ao reconhecimento de Deus. Não ensinam a dispensar conselho, estudo ou responsabilidade."],["Considere a correção como parte do aprendizado","Os versículos 11-12 falam de disciplina. Trate isso com cuidado: nunca use o texto para justificar abuso ou humilhação."]] }
,{keys:["próximo","proximo","compaixao","bom samaritano","ajudar o proximo"],text:"Lucas 10:25-37",goal:"Refletir sobre compaixão prática e sobre quem se torna próximo.",ctx:"Lucas 10:25-37 começa com a conversa de Jesus com um especialista na lei sobre vida eterna e o mandamento de amar o próximo. A parábola responde à pergunta sobre quem é o próximo e apresenta um samaritano como aquele que age com misericórdia. Leia a narrativa considerando as tensões entre os grupos envolvidos.",refs:"Lucas 10:25-37; Levítico 19:18; Lucas 6:27-36.",ill:"Use uma situação hipotética em que alguém atravessa barreiras sociais para oferecer ajuda segura e concreta.",topics:[["Observe a pergunta e a resposta inicial","Os versículos 25-29 mostram a conversa antes da parábola. Não comece a interpretação no meio da história."],["Repare em quem age com misericórdia","Jesus escolhe um samaritano como personagem central, contrariando expectativas do ouvinte."],["Transforme compaixão em cuidado concreto","O samaritano se aproxima, cuida e assume um custo. Aplique com respeito, segurança e atenção às necessidades reais."]] }
,{keys:["paz","ansiedade","preocupação","preocupacao"],text:"Filipenses 4:4-9",goal:"Relacionar oração, paz e práticas que sustentam a comunidade em tempos difíceis.",ctx:"Filipenses 4:4-9 reúne exortações finais da carta: alegria, gentileza, oração, gratidão e atenção ao que é verdadeiro e digno. A promessa de paz não deve ser usada para culpar quem vive ansiedade ou para sugerir que oração substitui apoio e tratamento.",refs:"Filipenses 4:4-9; 1 Tessalonicenses 5:16-22; Salmos 55:16-23.",ill:"Fale de práticas de apoio que podem caminhar juntas: oração, presença de pessoas confiáveis e busca de cuidado profissional quando necessário.",topics:[["Leia os conselhos em sequência","Observe como gentileza, oração e gratidão aparecem lado a lado nos versículos 4-7."],["Entenda a paz como cuidado, não como culpa","O texto oferece uma promessa de paz, não uma acusação contra quem continua sofrendo."],["Pratique atenção e ação","Os versículos 8-9 ligam o que se pensa ao que se pratica. Considere hábitos e relações que promovam o bem."]] },{keys:["criação","criacao","dignidade humana","imagem de deus","cuidado da criação"],text:"Gênesis 1:26-31",goal:"Refletir sobre a dignidade humana e a responsabilidade de cuidar da criação.",ctx:"Gênesis 1:1–2:3 apresenta a criação em forma literária organizada, culminando na humanidade criada à imagem de Deus e na avaliação de que a criação é muito boa. O trecho associa dignidade e responsabilidade; evite usar domínio como licença para exploração.",refs:"Gênesis 1:26-31; Salmos 8:3-8; Gênesis 2:15.",ill:"Use um exemplo hipotético de alguém que recebeu algo valioso para cuidar e precisa prestar contas de como o tratou.",topics:[["Reconheça a dignidade recebida","O texto atribui valor à humanidade por sua relação com Deus. A dignidade não depende de status, capacidade ou produtividade."],["Leia responsabilidade como serviço","A linguagem de domínio aparece junto à tarefa de cuidar. Explore responsabilidade, limites e prestação de contas."],["Celebre a criação como bem confiado","A avaliação de que a criação é boa convida gratidão e cuidado concreto. Relacione a mensagem a ações possíveis na família e na comunidade."]] },{keys:["vocação","chamado","moisés","missão","coragem para servir"],text:"Êxodo 3:1-15",goal:"Encorajar uma resposta fiel ao chamado, reconhecendo a presença de Deus e as necessidades do próximo.",ctx:"Êxodo 3 narra o chamado de Moisés junto à sarça. O episódio vem após a descrição da opressão no Egito: Deus vê, ouve e conhece o sofrimento do povo e envia Moisés. Não reduza o chamado a sucesso pessoal; ele está ligado à libertação e ao serviço.",refs:"Êxodo 3:1-15; Êxodo 2:23-25; Êxodo 4:10-17.",ill:"Apresente uma situação hipotética em que alguém percebe uma necessidade coletiva e procura apoio antes de agir.",topics:[["Deus vê o sofrimento","Observe como a narrativa relaciona a atenção de Deus ao clamor do povo. A missão começa com a necessidade real de outras pessoas."],["O chamado inclui presença","Moisés expressa insegurança, e a resposta central é a promessa de presença. Não transforme isso em garantia de facilidade."],["A resposta se concretiza em serviço","O envio de Moisés aponta para uma tarefa difícil e comunitária. Discuta passos responsáveis, parceria e coragem."]] },{keys:["família","filhos","pais","discipulado em casa","educação cristã"],text:"Deuteronômio 6:4-9",goal:"Incentivar uma fé vivida e ensinada no cotidiano, com cuidado e coerência.",ctx:"Deuteronômio 6 integra as palavras de Moisés ao povo antes da entrada na terra. O amor a Deus é apresentado como compromisso integral e ligado à transmissão cotidiana entre gerações. Não use o trecho para justificar controle ou violência dentro de casa.",refs:"Deuteronômio 6:4-9; Salmos 78:1-8; Efésios 6:1-4.",ill:"Descreva uma rotina familiar comum em que uma conversa breve e respeitosa cria espaço para valores e perguntas.",topics:[["Comece pelo amor a Deus","O ensino começa com devoção integral, não com uma lista de técnicas para controlar crianças."],["Ensine no ritmo da vida","O texto fala de conversar em diferentes momentos do cotidiano. Valorize exemplo, escuta e repetição paciente."],["Torne a fé visível sem coerção","Os sinais nas portas e mãos expressam lembrança. Pense em práticas familiares que convidem, acolham dúvidas e respeitem a segurança de todos."]] },{keys:["arrependimento","confissão","pecado","restauração","salmo 51"],text:"Salmos 51:1-12",goal:"Refletir sobre confissão sincera, misericórdia e renovação sem esconder a responsabilidade.",ctx:"O título do Salmo 51 o relaciona à confrontação de Natã com Davi em 2 Samuel 12. O poema combina reconhecimento do pecado, pedido de misericórdia e desejo de renovação. Perdão não apaga a necessidade de reparar danos nem substitui proteção a quem foi ferido.",refs:"Salmos 51:1-12; 2 Samuel 12:1-13; 1 João 1:8-9.",ill:"Use um exemplo hipotético de alguém que reconhece um erro, pede perdão sem desculpas e toma medidas para reparar o dano.",topics:[["Dê nome à responsabilidade","A oração não transfere a culpa para outras pessoas. Convide a uma confissão honesta e específica."],["Peça renovação, não apenas alívio","O salmista deseja um coração renovado e uma vida transformada. Explore a mudança de direção que acompanha o arrependimento."],["Una misericórdia e reparação","A graça não é licença para repetir o dano. Fale de restituição, limites, acompanhamento e cuidado com as pessoas afetadas."]] },{keys:["socorro","proteção","viagem","peregrinação","salmo 121"],text:"Salmos 121:1-8",goal:"Afirmar confiança no cuidado de Deus durante a jornada sem prometer ausência de sofrimento.",ctx:"O Salmo 121 faz parte dos cânticos de romagem. A repetição sobre guardar comunica confiança na presença de Deus ao longo da jornada. Não o use como garantia de que pessoas fiéis nunca sofrerão acidentes, doença ou perda.",refs:"Salmos 121:1-8; Salmos 23:1-6; Salmos 46:1-3.",ill:"Imagine uma pessoa iniciando uma longa viagem e recebendo apoio de uma comunidade que acompanha e cuida dela.",topics:[["Pergunte de onde vem o auxílio","O salmista olha para os montes e declara de onde vem o socorro. Apresente a pergunta como expressão de confiança, não de negação do risco."],["Observe a linguagem de cuidado","A imagem de guardar aparece repetidamente. Explore a companhia de Deus durante o caminho."],["Aplique a confiança com responsabilidade","Orar por proteção combina com prudência, cuidado mútuo e busca de ajuda quando necessário."]] },{keys:["cansaço","desânimo","desanimo","esperança em deus","força para continuar"],text:"Isaías 40:27-31",goal:"Consolar quem está cansado e renovar esperança sem minimizar o sofrimento.",ctx:"Isaías 40 abre uma seção de consolo dirigida a um povo que se sente esquecido. O texto contrasta a limitação humana com o poder do Criador e usa a imagem de renovar forças. Não culpe quem está exausto nem prometa que a espera elimina imediatamente toda dificuldade.",refs:"Isaías 40:27-31; Salmos 103:1-5; 2 Coríntios 4:7-10.",ill:"Use uma imagem hipotética de caminhada longa em que a pessoa precisa parar, receber cuidado e seguir com apoio.",topics:[["Nomeie a sensação de abandono","O versículo 27 registra a pergunta de quem pensa que seu caminho foi ignorado. O texto acolhe a queixa antes de responder."],["Lembre o caráter de Deus","A resposta destaca o Criador que não se cansa. Desenvolva a diferença entre a limitação humana e a fidelidade divina."],["Espere com perseverança e apoio","A imagem de renovar forças encoraja continuidade, não desempenho sem descanso. Inclua oração, comunidade e cuidado físico e emocional."]] },{keys:["bem-aventuranças","felicidade","sermão do monte","reino de deus","pobres de espírito"],text:"Mateus 5:1-12",goal:"Apresentar os valores do Reino de Deus e encorajar fidelidade em meio a situações difíceis.",ctx:"As bem-aventuranças abrem o Sermão do Monte em Mateus. Jesus chama bem-aventurados grupos que não correspondem às medidas comuns de poder e sucesso. O trecho não romantiza pobreza, luto ou perseguição, nem promete que a fidelidade será sempre recompensada nesta vida.",refs:"Mateus 5:1-12; Lucas 6:20-23; Isaías 61:1-3.",ill:"Compare, como exercício, o que a cultura considera sucesso com as pessoas que Jesus declara bem-aventuradas.",topics:[["Observe quem recebe a declaração de bênção","Leia cada bem-aventurança e note a atenção aos pobres, aflitos e perseguidos."],["Relacione caráter e esperança","Misericórdia, pureza de coração e promoção da paz aparecem junto à esperança do Reino. Evite separar ética e promessa."],["Aplique sem romantizar a dor","A passagem consola e chama à justiça. Não diga a pessoas vulneráveis que devem aceitar violência ou injustiça para serem abençoadas."]] },{keys:["ansiedade","preocupação","preocupacao","futuro","provisão"],text:"Mateus 6:25-34",goal:"Convidar à confiança e ao cuidado mútuo diante das preocupações da vida.",ctx:"Mateus 6:25-34 está no Sermão do Monte, depois do ensino sobre tesouros e lealdade. As imagens de aves e flores orientam a confiança no cuidado de Deus e a busca do Reino. O trecho não deve ser usado para envergonhar quem enfrenta ansiedade clínica ou necessidades materiais.",refs:"Mateus 6:25-34; Filipenses 4:4-9; Salmos 55:16-23.",ill:"Fale de uma comunidade que organiza ajuda concreta para alguém preocupado com alimentação, moradia ou trabalho.",topics:[["Observe o que está em jogo","Jesus fala de necessidades reais e da preocupação com o amanhã. Evite tratar problemas materiais como falta de fé."],["Contemple as imagens usadas por Jesus","Aves e flores ilustram o cuidado do Criador. Explique a comparação com humildade, sem transformar metáfora em promessa de riqueza."],["Busque o Reino hoje","O chamado final orienta prioridades e solidariedade. Convide a uma ação concreta de cuidado e a buscar apoio para a ansiedade."]] },{keys:["missão","evangelismo","grande comissão","fazer discípulos","discipulado"],text:"Mateus 28:16-20",goal:"Encorajar uma missão que forma discípulos com ensino, presença e serviço.",ctx:"Mateus 28:16-20 encerra o Evangelho com a comissão do Ressuscitado aos discípulos. A missão envolve fazer discípulos, batizar e ensinar a guardar os ensinamentos de Jesus. Não use a passagem para justificar coerção, dominação cultural ou desrespeito a outros povos.",refs:"Mateus 28:16-20; Atos 1:6-8; Mateus 5:13-16.",ill:"Apresente uma experiência hipotética de mentoria em que alguém aprende, pratica e depois acompanha outra pessoa.",topics:[["Comece com a autoridade de Jesus","O envio nasce da afirmação sobre a autoridade do Ressuscitado. Explique a base da missão no próprio texto."],["Entenda o objetivo: formar discípulos","Fazer discípulos inclui batizar e ensinar a viver os mandamentos. Não reduza a missão a contar decisões."],["Viva a promessa da presença","A conclusão promete companhia até o fim. Aplique por meio de ensino paciente, serviço e testemunho respeitoso."]] },{keys:["tempestade","medo","jesus acalma a tempestade","confiança em jesus"],text:"Marcos 4:35-41",goal:"Refletir sobre medo, confiança e a autoridade de Jesus sem banalizar perigos reais.",ctx:"Marcos 4:35-41 aparece após parábolas sobre o Reino e antes de outras narrativas de autoridade de Jesus. Os discípulos enfrentam uma tempestade no lago. A pergunta final sobre a identidade de Jesus é central; a história não promete que todo perigo será removido imediatamente.",refs:"Marcos 4:35-41; Salmos 107:23-30; Marcos 5:1-20.",ill:"Use uma situação hipotética de crise em que medo e confiança coexistem enquanto a comunidade toma medidas seguras.",topics:[["Reconheça o perigo narrado","Os discípulos descrevem uma ameaça concreta. A fé da passagem não exige fingir que o perigo não existe."],["Observe a resposta de Jesus","A narrativa mostra a autoridade de Jesus sobre o vento e o mar. Leia a cena inteira antes de extrair uma regra geral."],["Escute a pergunta sobre identidade","O espanto dos discípulos conduz à pergunta sobre quem é Jesus. Aplique a confiança sem culpar quem sente medo."]] },{keys:["filho pródigo","filho prodigo","perdão","misericórdia","misericordia","retorno a deus"],text:"Lucas 15:11-32",goal:"Explorar a misericórdia do pai e o desafio dirigido também a quem se considera justo.",ctx:"Lucas 15 reúne parábolas após críticas à acolhida de Jesus a pessoas consideradas pecadoras. A parábola inclui dois filhos: o mais novo retorna e o mais velho resiste à festa. Não reduza a história a uma fórmula sobre dinheiro ou a uma exigência para vítimas retomarem relações inseguras.",refs:"Lucas 15:11-32; Lucas 15:1-10; Oseias 11:1-9.",ill:"Imagine uma família diante de uma reconciliação que exige verdade, responsabilidade e segurança para todos.",topics:[["Observe a ruptura e o retorno","O filho mais novo parte e depois reconhece sua condição. Leia o percurso sem transformar a experiência em receita universal."],["Veja como o pai age","O pai acolhe o retorno e organiza uma celebração. A graça aparece em ações concretas de recepção."],["Ouça a resistência do filho mais velho","A parábola termina com um convite ainda aberto. Pergunte quem fica de fora quando a comunidade celebra a restauração."]] },{keys:["novo nascimento","nascer de novo","amor de deus","salvação","nicodemos"],text:"João 3:1-17",goal:"Explicar a conversa sobre nascer do alto, a ação do Espírito e o amor de Deus revelado em Jesus.",ctx:"João 3 apresenta Nicodemos, um fariseu e líder que procura Jesus à noite. O diálogo usa linguagem sobre nascer de novo ou do alto e relaciona a ação do Espírito à vida. João 3:16-17 aparece dentro da conversa sobre o Filho enviado; leia os versículos ao redor e não transforme uma frase em slogan isolado.",refs:"João 3:1-17; Ezequiel 36:25-27; João 1:9-13.",ill:"Use a imagem de uma mudança que não é apenas maquiagem exterior, mas uma nova origem e direção.",topics:[["Escute a pergunta de Nicodemos","A conversa começa com reconhecimento e perplexidade. O diálogo mostra que informação religiosa não elimina a necessidade de transformação."],["Explique a imagem do nascimento","Jesus relaciona nascimento do alto à ação do Espírito. Apresente a metáfora sem reduzi-la a uma única experiência emocional."],["Leia o envio do Filho no contexto","O amor de Deus aparece no envio do Filho para que o mundo tenha vida. Destaque a iniciativa divina e o convite à fé."]] },{keys:["videira","permanecer em cristo","fruto do espírito","frutificar","vida com deus"],text:"João 15:1-11",goal:"Encorajar uma vida de permanência em Jesus que produz fruto e amor.",ctx:"João 15 integra o discurso de despedida de Jesus aos discípulos. A imagem da videira e dos ramos descreve dependência, permanência e fruto. Não use a linguagem sobre ramos para ameaçar pessoas vulneráveis ou equiparar produtividade a valor humano.",refs:"João 15:1-11; Gálatas 5:22-25; João 13:34-35.",ill:"Compare o cuidado contínuo de um jardineiro com práticas de comunidade que sustentam crescimento sem exigir resultados instantâneos.",topics:[["Reconheça a fonte da vida","Jesus se apresenta como videira e os discípulos como ramos. O fruto não nasce da autossuficiência."],["Entenda permanência como relação","Permanecer envolve guardar as palavras e continuar no amor de Jesus. Explore oração, obediência e comunhão."],["Identifique o fruto pelo amor","O contexto do Evangelho liga discipulado e amor mútuo. Discuta resultados que servem outras pessoas, não apenas prestígio."]] },{keys:["sofrimento","esperança","providência","providencia","nada nos separa","amor de deus"],text:"Romanos 8:18-39",goal:"Anunciar esperança e a permanência do amor de Deus em meio ao sofrimento.",ctx:"Romanos 8 fala da criação que geme, da fraqueza humana e da esperança. O clímax afirma que nada poderá separar os que estão em Cristo do amor de Deus. O texto não nega perdas nem promete que tudo o que acontece é bom; cuidado para não silenciar o lamento.",refs:"Romanos 8:18-39; Salmos 44:22-26; 2 Coríntios 4:16-18.",ill:"Use a imagem de uma comunidade que acompanha alguém em luto sem apressar explicações, permanecendo presente.",topics:[["Não esconda o gemido","O texto reconhece sofrimento na criação e na vida dos que esperam. A esperança cristã não precisa negar a dor."],["Veja o auxílio na fraqueza","Paulo fala da ajuda do Espírito quando não sabemos orar. Trate a passagem como consolo, não como cobrança."],["Conclua com a segurança do amor","A lista final não diz que nada doloroso acontece; afirma que nada separa do amor de Deus em Cristo. Convide à perseverança e à solidariedade."]] },{keys:["serviço","dons","corpo de cristo","transformação","transformacao","vida cristã"],text:"Romanos 12:1-8",goal:"Conectar adoração, renovação da mente e serviço mútuo na comunidade.",ctx:"Romanos 12 inicia uma seção de exortações após a exposição teológica dos capítulos anteriores. Paulo liga a misericórdia de Deus à vida comunitária, à humildade e à diversidade de dons. Não transforme dons em hierarquia de valor nem em obrigação de trabalho sem limites.",refs:"Romanos 12:1-8; 1 Coríntios 12:4-27; Efésios 4:1-16.",ill:"Descreva uma equipe em que pessoas com capacidades diferentes cooperam para atender uma necessidade comum.",topics:[["Responda à misericórdia com a vida","A apresentação do corpo expressa dedicação cotidiana. Evite tratar adoração como apenas um evento."],["Renove a forma de pensar","O contraste com os padrões deste mundo convida discernimento. Pergunte quais valores precisam ser avaliados à luz do bem."],["Sirva com humildade e diversidade","A imagem do corpo impede que um membro se considere todo o corpo. Aplique com participação, respeito e limites saudáveis."]] },{keys:["amor cristão","caridade","dons espirituais","amor","1 coríntios 13"],text:"1 Coríntios 13:1-13",goal:"Mostrar que os dons e a maturidade cristã devem ser avaliados pela prática do amor.",ctx:"1 Coríntios 13 está no argumento de Paulo sobre dons e vida comunitária nos capítulos 12 a 14. O amor descrito não é somente sentimento romântico. O capítulo confronta competição e busca de prestígio na igreja.",refs:"1 Coríntios 13:1-13; 1 Coríntios 12:12-31; 1 João 4:7-12.",ill:"Compare duas formas hipotéticas de exercer liderança: uma que busca aplauso e outra que protege e serve pessoas.",topics:[["Leia o capítulo dentro da conversa sobre dons","Os versículos 1-3 mostram que capacidade sem amor perde seu propósito. Retome o contexto dos capítulos 12 e 14."],["Observe ações e atitudes do amor","Paciência, bondade e recusa da arrogância descrevem práticas observáveis. Aplique ao modo como a comunidade trata pessoas."],["Mantenha a esperança e a humildade","O amor permanece, enquanto conhecimento e profecia são parciais. Isso pede humildade diante do que ainda não sabemos."]] },{keys:["liberdade cristã","fruto do espírito","fruto do espirito","obras da carne","gálatas 5"],text:"Gálatas 5:13-26",goal:"Explicar a liberdade cristã como serviço amoroso e vida conduzida pelo Espírito.",ctx:"Gálatas 5 responde à disputa da carta sobre a lei, a liberdade e a vida dos gentios em Cristo. Paulo contrapõe práticas destrutivas ao fruto do Espírito e insiste no amor ao próximo. Não use a lista para rotular ou controlar pessoas.",refs:"Gálatas 5:13-26; Gálatas 3:26-29; Romanos 12:9-21.",ill:"Use uma cena hipotética de uma comunidade que resolve desacordos sem agressão e busca o bem mútuo.",topics:[["Entenda para que serve a liberdade","Paulo não apresenta liberdade como egoísmo, mas como oportunidade de servir em amor."],["Compare práticas que constroem e destroem","Leia as listas no contexto da vida comunitária. Evite usar uma lista como arma contra grupos ou indivíduos."],["Cultive o fruto como caminho contínuo","O fruto do Espírito descreve uma vida em formação. Convide a comunidade a escolher práticas de amor, domínio próprio e paz."]] },{keys:["unidade da igreja","maturidade","igreja","unidade","dons ministeriais"],text:"Efésios 4:1-16",goal:"Promover unidade, serviço e maturidade sem exigir uniformidade.",ctx:"Efésios 4 passa das afirmações sobre a obra de Deus para uma vida comunitária coerente com o chamado. Unidade, diversidade de serviços e crescimento aparecem juntos. O texto não justifica silenciar diferenças ou concentrar poder.",refs:"Efésios 4:1-16; 1 Coríntios 12:12-27; Colossenses 3:12-15.",ill:"Imagine um corpo com funções diferentes que precisa cooperar para cuidar de alguém; nenhuma parte substitui todas as outras.",topics:[["Viva de modo coerente com o chamado","Humildade, mansidão, paciência e amor sustentam a unidade. São práticas relacionais, não apenas ideias."],["Receba a diversidade de serviço","A passagem fala de diferentes funções para equipar a comunidade. Líderes capacitam outras pessoas, não acumulam todo o trabalho."],["Cresça em verdade e amor","Maturidade envolve discernimento e cuidado mútuo. Aplique contra manipulação e infantilização espiritual."]] },{keys:["humildade","serviço de jesus","exemplo de cristo","esvaziamento","filipenses 2"],text:"Filipenses 2:1-11",goal:"Apresentar a humildade de Cristo como referência para relações comunitárias.",ctx:"Filipenses 2 relaciona unidade e humildade a uma passagem cristológica sobre a descida e exaltação de Cristo. A linguagem não deve ser usada para exigir que vítimas permaneçam em situações de abuso ou para defender a anulação da dignidade.",refs:"Filipenses 2:1-11; João 13:1-17; Marcos 10:42-45.",ill:"Compare uma liderança que usa posição para servir com outra que exige reconhecimento e obediência irrestrita.",topics:[["Comece pelo apelo à unidade","Paulo liga consolo e comunhão a uma atitude de humildade. Leia os versículos 1-4 antes do hino."],["Contemple o caminho de Cristo","O texto apresenta Cristo em humildade e serviço. Explique a passagem com reverência e sem usar sofrimento como instrumento de controle."],["Relacione humildade e honra","A exaltação final não é autopromoção. Convide a comunidade a reconhecer o bem e a servir sem competir por status."]] },{keys:["nova criação","esperança futura","luto","fim do sofrimento","apocalipse 21"],text:"Apocalipse 21:1-5",goal:"Oferecer esperança de renovação e presença de Deus sem especular datas ou cronologias.",ctx:"Apocalipse 21 apresenta imagens de novo céu, nova terra e a cidade de Deus após as visões de juízo. O foco é a renovação e a presença divina junto aos povos. Leia como literatura apocalíptica; não transforme símbolos em calendário de acontecimentos.",refs:"Apocalipse 21:1-5; Isaías 65:17-25; Romanos 8:18-25.",ill:"Descreva uma visão hipotética de uma comunidade reconstruindo o que foi destruído e acolhendo quem sofreu.",topics:[["Leia as imagens como esperança","Novo céu e nova terra expressam renovação. Evite previsões que o texto não dá."],["Observe Deus habitando com os povos","A imagem central é a presença de Deus e o fim das lágrimas, morte e dor."],["Viva hoje à luz da promessa","A esperança futura inspira consolo e responsabilidade presente. Não use o texto para apressar o luto ou minimizar a dor."]] }];
const LOCAL_THEOLOGY_NOTES=[{keys:["trindade","doutrina trinitaria","deus trino","um so deus tres pessoas","pai filho espirito santo","divindade de jesus","divindade do espirito santo","trinitario"],text:"Mateus 28:16-20; 2 Coríntios 13:13-14",goal:"Explicar a doutrina cristã da Trindade como confissão de um só Deus: Pai, Filho e Espírito Santo, distintos sem serem três deuses.",ctx:"A palavra Trindade não aparece no texto bíblico; é um termo teológico posterior usado para sintetizar o testemunho bíblico. A formulação trinitária histórica afirma um só Deus e distingue Pai, Filho e Espírito Santo, sem confundi-los nem dividir a divindade. Deuteronômio 6:4 e 1 Coríntios 8:4-6 situam a fé cristã no monoteísmo. Mateus 3:13-17 mostra Pai, Filho e Espírito na cena do batismo de Jesus; Mateus 28:19 e 2 Coríntios 13:13-14 apresentam fórmulas que mencionam os três. João 1:1-3,14 e 20:28 são lidos pela tradição trinitária em relação à identidade divina do Filho; Atos 5:3-4 relaciona mentir ao Espírito e mentir a Deus. Nenhum desses trechos, isoladamente, apresenta toda a definição técnica posterior. Diferencie o que cada texto afirma da síntese doutrinária e reconheça que grupos cristãos e outras tradições interpretam esses textos de modos diferentes.",refs:"Deuteronômio 6:4; Mateus 3:13-17; Mateus 28:16-20; João 1:1-3,14; João 14:16-17,26; João 20:28; Atos 5:3-4; 1 Coríntios 8:4-6; 2 Coríntios 13:13-14.",ill:"Prefira explicar a doutrina pelos textos em conjunto. Analogias como água em três estados ou um ovo dividido em partes são limitadas e podem sugerir ideias diferentes da doutrina que pretendem explicar.",topics:[["Comece pelo monoteísmo bíblico","Leia Deuteronômio 6:4 e 1 Coríntios 8:4-6. A doutrina da Trindade não ensina três deuses. Explique como a tradição cristã procura manter a afirmação de um só Deus ao falar do Pai, do Filho e do Espírito."],["Observe a distinção entre Pai, Filho e Espírito","Em Mateus 3:13-17, a narrativa do batismo distingue Jesus, a voz do Pai e o Espírito que desce. Em João 14:16-17, Jesus fala do Pai enviando outro Consolador. Essas relações não devem ser reduzidas a três nomes intercambiáveis de uma só pessoa."],["Apresente a síntese cristã com humildade","Mateus 28:19 e 2 Coríntios 13:13-14 reúnem Pai, Filho e Espírito; João 1:1-3,14 e João 20:28 participam da discussão sobre a identidade do Filho. Explique que a fórmula técnica é uma síntese teológica posterior e mostre o caminho dos textos, sem dizer que a palavra Trindade está literalmente na Bíblia."]]}];
LOCAL_SERMON_BANK.push(...LOCAL_THEOLOGY_NOTES);
const AI_DEFAULT={theme:"",text:"",passage:"",type:"Expositiva",duration:30,aud:"",goal:"",style:"Pastoral e acolhedor"};
function localNormalizeSermon(t){return String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function localBibleStory(id,titulo,referencia,aliases,resumo,licao,contexto,points,categoria){const narratives=["zacchaeus","lazarus-bethany","daniel-lions","jonah"];return{id,titulo,referencia,aliases,resumo,lição:licao,contexto,categoria:categoria||(narratives.includes(id)?"Narrativas bíblicas":"Parábolas de Jesus"),topicos:points.map(([titulo,exegese,aplicacao])=>({titulo,exegese,aplicacao}))}}
// Notas editoriais locais para gerar esboços sem enviar o tema ou a passagem a serviços externos.
const LOCAL_BIBLE_STORIES=[
  localBibleStory("prodigal","O Filho Pródigo","Lucas 15:11–32",["filho prodigo","filho perdido","pai misericordioso"],"O filho mais novo pede a herança, parte para longe e a perde. Em necessidade, volta para casa; o pai o recebe com compaixão. O irmão mais velho se ressente da festa e se recusa a entrar.","A parábola responde à crítica por Jesus receber pecadores. Ela destaca arrependimento, alegria pela restauração e o desafio do ressentimento; o final deixa em aberto a resposta do irmão mais velho.","Lucas 15 começa com pecadores se aproximando de Jesus e líderes religiosos criticando sua acolhida. Há dois filhos na narrativa; não reduza o ensino apenas ao retorno do mais novo.",[
    ["A ruptura e o retorno do filho mais novo","Lucas 15:11–20 descreve o pedido da herança, a partida, a fome e a decisão de voltar. A narrativa não chama a pobreza do filho de maldição.","Fale de reconhecer erros e buscar reparação. Não prometa que toda família reagirá igual nem pressione alguém a voltar a uma relação insegura."],
    ["A compaixão do pai acolhe e restaura","Em Lucas 15:20–24, o pai corre ao encontro do filho e organiza uma celebração. O retorno é motivo de alegria, não mérito comprado.","Promova acolhimento com dignidade, limites saudáveis e apoio para mudanças consistentes."],
    ["O irmão mais velho também precisa responder","Lucas 15:25–32 mostra o irmão mais velho ressentido; o pai também sai ao encontro dele. A parábola termina sem contar se ele entrou.","Examine como comparação e senso de merecimento impedem a alegria pela restauração de outra pessoa."]]),
  localBibleStory("good-samaritan","O Bom Samaritano","Lucas 10:25–37",["bom samaritano","parabola do samaritano","samaritano misericordioso"],"Após uma conversa sobre amar o próximo, Jesus conta a história de um homem ferido na estrada. Um sacerdote e um levita passam; um samaritano se aproxima, cuida dele e providencia ajuda.","Jesus desloca a pergunta de quem merece ser o próximo para a ação misericordiosa que se faz próxima de quem precisa. A compaixão aparece em cuidado concreto e custoso.","Lucas 10:25–29 apresenta a pergunta de um especialista na lei sobre quem é o próximo. A parábola responde dentro dessa conversa; o texto não informa os motivos pelos quais os dois passantes seguem adiante.",[
    ["A necessidade humana está no centro da cena","Lucas 10:30–32 apresenta o homem ferido e dois passantes que seguem adiante. O narrador não explica por que passaram.","Perceba necessidades sem especular sobre a culpa de quem sofre. Considere segurança, consentimento e recursos ao oferecer ajuda."],
    ["O samaritano atravessa a distância social","Em Lucas 10:33–35, o samaritano sente compaixão, aproxima-se, trata as feridas e organiza hospedagem e pagamento. Jesus destaca alguém de um grupo desprezado por muitos ouvintes.","Identifique barreiras sociais que dificultam o cuidado e planeje uma resposta respeitosa, além de sentimentos de pena."],
    ["Jesus chama a praticar misericórdia","Em Lucas 10:36–37, Jesus pergunta quem se tornou próximo e conclui com a ordem de agir de modo semelhante.","Proponha um passo viável: acompanhar alguém, conectar a serviços ou organizar ajuda comunitária."]]),
  localBibleStory("sower","O Semeador","Mateus 13:1–23; Marcos 4:1–20; Lucas 8:4–15",["semeador","parabola do semeador","quatro terrenos","solos da parabola"],"Jesus descreve sementes que caem à beira do caminho, em solo pedregoso, entre espinhos e em boa terra. Depois, explica a parábola aos discípulos, relacionando os terrenos a diferentes respostas à palavra.","A parábola retrata respostas diversas à palavra e chama a escutar com atenção e perseverança. Os terrenos não devem ser usados para rotular pessoas como casos perdidos.","Marcos 4 reúne ensinamentos de Jesus junto ao mar. A própria narrativa explica a parábola em 4:13–20; leia a explicação junto da história.",[
    ["A palavra é anunciada em terrenos diferentes","Marcos 4:3–9 repete a ação de semear e descreve quatro destinos da semente. Jesus conclui: quem tem ouvidos para ouvir, ouça.","Converse sobre distrações, pressões e obstáculos à escuta sem classificar alguém de forma permanente."],
    ["A explicação identifica respostas e obstáculos","Em Marcos 4:14–19, Jesus explica a semente como palavra e menciona aflição, perseguição, preocupações e desejo de riquezas.","Reconheça pressões reais e crie apoio por meio de leitura conjunta, conversa e acompanhamento."],
    ["A boa terra produz fruto","Marcos 4:20 fala de quem ouve, acolhe e frutifica em proporções diferentes. O texto destaca fruto, não competição.","Defina um fruto concreto para cultivar em grupo, como reconciliação responsável, generosidade ou cuidado constante."]]),
  localBibleStory("lost-sheep","A Ovelha Perdida","Lucas 15:1–7; Mateus 18:10–14",["ovelha perdida","parabola da ovelha perdida","ovelha desgarrada"],"Jesus fala de um pastor que vai atrás da ovelha perdida até encontrá-la. Ao voltar, reúne amigos e vizinhos para celebrar.","A parábola mostra alegria pela pessoa que se volta para Deus e responde à crítica contra o acolhimento de pecadores. O centro é a busca e a alegria.","Lucas 15:1–2 informa que pecadores se aproximavam de Jesus enquanto escribas e fariseus criticavam sua recepção. A história responde a essa reclamação.",[
    ["Jesus percebe quem se perdeu","Lucas 15:3–4 começa com a busca pela ovelha que se perdeu. A história apresenta iniciativa de procura.","Procure quem se afastou com cuidado e respeito, sem exposição, coerção ou invasão de limites."],
    ["A busca culmina em cuidado e alegria","Lucas 15:5–6 descreve o pastor carregando a ovelha e chamando outros para celebrar.","Ofereça acompanhamento concreto para que o acolhimento continue depois do primeiro encontro."],
    ["Jesus interpreta a alegria da restauração","Lucas 15:7 relaciona a alegria por quem se arrepende ao tema do céu, em resposta à crítica do início do capítulo.","Receba passos de mudança com alegria e apoio, sem exigir perfeição imediata."]]),
  localBibleStory("lost-coin","A Moeda Perdida","Lucas 15:8–10",["moeda perdida","dracma perdida","parabola da moeda perdida"],"Uma mulher perde uma de suas dez moedas, acende uma lamparina e procura cuidadosamente até encontrá-la. Depois chama outras pessoas para celebrar.","A parábola, junto da ovelha perdida, retrata alegria pela restauração e responde às críticas ao acolhimento de Jesus. Não é necessário transformar cada objeto em um símbolo separado.","Lucas 15:8–10 está entre as parábolas da ovelha perdida e do pai com dois filhos. As três histórias desenvolvem perda, encontro e alegria.",[
    ["A perda é levada a sério","Lucas 15:8 destaca uma moeda entre dez que desaparece. A mulher percebe a ausência e decide procurar.","Leve a sério quem se sente esquecido e escute antes de presumir do que a pessoa precisa."],
    ["A procura é cuidadosa e persistente","A mulher acende a lamparina, varre a casa e procura com cuidado até encontrar a moeda.","Transforme preocupação em acompanhamento prático, respeitando o ritmo da pessoa."],
    ["Encontrar conduz à celebração compartilhada","Lucas 15:9–10 termina com uma celebração e a interpretação sobre alegria diante de Deus.","Celebre passos de reconciliação e mudança sem exigir perfeição imediata."]]),
  localBibleStory("pharisee-tax-collector","O Fariseu e o Publicano","Lucas 18:9–14",["fariseu e publicano","fariseu e cobrador de impostos","parabola do fariseu"],"Dois homens vão ao templo para orar. O fariseu enumera suas práticas e se compara ao outro; o cobrador de impostos pede misericórdia. Jesus conclui que este volta para casa justificado.","Jesus confronta a confiança na própria justiça acompanhada de desprezo pelos outros. A parábola chama à humildade e não autoriza estereótipos sobre todos os fariseus ou cobradores de impostos.","Lucas 18:9 identifica os destinatários: pessoas que confiavam em si mesmas como justas e desprezavam os demais. Esse versículo orienta a leitura.",[
    ["A comparação pode esconder orgulho","Lucas 18:10–12 mostra a oração do fariseu marcada por comparação e enumeração de virtudes. Jesus não a apresenta como modelo.","Pratique autoavaliação sem humilhar grupos religiosos. Pergunte se a espiritualidade produz gratidão ou desprezo."],
    ["O publicano reconhece sua necessidade","Lucas 18:13 descreve o homem pedindo misericórdia. O texto destaca sua súplica, não uma performance religiosa.","Abra espaço para confissão e pedido de ajuda sem transformar vulnerabilidade em vergonha."],
    ["Jesus inverte a expectativa","Lucas 18:14 afirma que o publicano volta justificado e conclui que quem se exalta será humilhado e quem se humilha será exaltado.","Pratique humildade por meio de escuta, reparação de erros e reconhecimento da dignidade alheia."]]),
  localBibleStory("rich-fool","O Rico Insensato","Lucas 12:13–21",["rico insensato","rico louco","parabola do rico insensato"],"Após um pedido sobre herança, Jesus alerta contra a ganância e conta a história de um homem cujas colheitas são abundantes e que planeja ampliar seus celeiros. Naquela noite, sua vida termina.","A parábola questiona a falsa segurança de acumular para si e convida a considerar a relação com Deus e o uso dos bens. Não ensina que toda pessoa rica seja má.","Lucas 12:13–15 começa com uma disputa de herança. Jesus alerta contra a ganância antes de contar a parábola; mantenha essa conversa junto do esboço.",[
    ["A vida não se mede pelo que se possui","Lucas 12:13–15 apresenta a disputa e o alerta de Jesus: a vida não consiste na abundância de bens.","Converse sobre como consumo e patrimônio afetam relações e procure soluções justas para conflitos."],
    ["Os planos do rico ignoram os limites da vida","Lucas 12:16–19 descreve novos celeiros e planos concentrados em guardar e desfrutar sozinho.","Planeje com responsabilidade, considerando também generosidade, descanso e o bem de outras pessoas."],
    ["Jesus chama a ser rico para com Deus","Lucas 12:20–21 contrasta acumular para si com ser rico para com Deus.","Escolha uma prática concreta de solidariedade sem condenar automaticamente quem possui bens."]]),
  localBibleStory("talents","A Parábola dos Talentos","Mateus 25:14–30",["talentos","parabola dos talentos","servos e talentos"],"Um senhor confia quantias diferentes a três servos antes de viajar. Ao voltar, avalia o que cada um fez; dois agem com os recursos recebidos, enquanto o terceiro os esconde por medo.","No contexto de Mateus 25, a parábola chama à responsabilidade durante a espera pelo senhor. “Talento” é uma quantia de dinheiro na história, não originalmente uma habilidade pessoal.","Mateus 24–25 reúne ensinamentos sobre vigilância e a vinda do Filho do Homem. Não confunda a parábola com a das minas, narrada em Lucas 19.",[
    ["O que se recebe implica responsabilidade","Mateus 25:14–15 diz que o senhor confia seus bens e distribui quantias diferentes segundo a capacidade de cada servo.","Fale de responsabilidade sem comparar o valor das pessoas; reconheça recursos e oportunidades distintos."],
    ["Dois servos agem com diligência","Mateus 25:16–23 relata que os dois primeiros trabalham com o que receberam e prestam contas ao retorno do senhor.","Use recursos e oportunidades em serviço fiel, com metas realistas e sem medir sucesso apenas por resultados visíveis."],
    ["O medo paralisa o terceiro servo","Mateus 25:24–30 apresenta a justificativa do terceiro e a resposta severa do senhor. Leia a linguagem de julgamento no conjunto do discurso.","Converse sobre medo e omissão sem usar a parábola para pressionar doações, trabalho excessivo ou exploração."]]),
  localBibleStory("unforgiving-servant","O Servo Impiedoso","Mateus 18:21–35",["servo impiedoso","servo incompassivo","servo que nao perdoou"],"Pedro pergunta sobre perdoar. Jesus conta a história de um servo cuja grande dívida é perdoada pelo rei, mas que se recusa a ter paciência com um companheiro que lhe deve muito menos.","A parábola liga o perdão recebido à responsabilidade de tratar o próximo com misericórdia. Perdão não elimina limites, proteção, justiça nem reparação.","Mateus 18:21–22 registra a pergunta de Pedro sobre quantas vezes perdoar. O relato usa dívida como imagem da misericórdia; leia o capítulo em seu conjunto.",[
    ["A misericórdia recebida é imensa","Mateus 18:23–27 descreve a dívida enorme e a decisão do rei de perdoá-la diante do pedido de paciência.","Convide à gratidão sem exigir que vítimas minimizem danos ou abandonem medidas de segurança."],
    ["O servo não estende a misericórdia","Mateus 18:28–30 mostra o servo cobrando com violência a dívida menor de seu companheiro.","Examine incoerências e, quando houver dano causado, assuma responsabilidade e faça reparação possível."],
    ["Jesus leva a sério a vida comunitária","Mateus 18:31–35 encerra a história com julgamento e reforça a seriedade do perdão. O texto não descreve todos os passos de reconciliação após abuso.","Ensine perdão sem coagir reconciliação. Se houver risco, priorize proteção, limites e ajuda especializada."]]),
  localBibleStory("workers-vineyard","Os Trabalhadores da Vinha","Mateus 20:1–16",["trabalhadores da vinha","trabalhadores da ultima hora","parabola da vinha"],"Um proprietário contrata trabalhadores em diferentes horários e paga a todos o mesmo valor combinado. Os que trabalharam mais horas reclamam; o proprietário responde sobre o acordo e sua generosidade.","A parábola questiona inveja e expectativas de mérito diante da generosidade de Deus. Não deve ser usada para justificar salários injustos: o proprietário paga o valor previamente combinado.","Mateus 19:27–30 fala de recompensa e termina com a ideia de que muitos primeiros serão últimos. Mateus 20:1 inicia a parábola conectada a essa discussão.",[
    ["O proprietário procura trabalhadores ao longo do dia","Mateus 20:1–7 mostra contratações em horários diferentes, inclusive perto do fim do expediente.","Observe quem fica de fora das oportunidades e como ampliar participação e dignidade."],
    ["O pagamento revela generosidade","Mateus 20:8–10 relata que todos recebem o valor combinado, começando pelos últimos.","Converse sobre generosidade sem transformar o texto em justificativa para explorar trabalho ou negar remuneração justa."],
    ["A comparação alimenta a reclamação","Mateus 20:11–16 mostra os primeiros reclamando por comparação e o proprietário questionando seu ressentimento.","Examine competição na comunidade e pratique gratidão sem ignorar desigualdades concretas que precisam ser corrigidas."]]),
  localBibleStory("two-builders","A Casa sobre a Rocha","Mateus 7:24–27; Lucas 6:46–49",["casa sobre a rocha","casa na areia","dois construtores","dois fundamentos"],"Jesus compara quem ouve e pratica suas palavras a uma pessoa que constrói sobre rocha, e quem ouve sem praticar a alguém que constrói sobre areia. Chuva, enchentes e ventos atingem ambas as casas.","O ensino conclui o Sermão do Monte com o chamado a praticar as palavras de Jesus. A parábola não promete que discípulos evitarão tempestades.","Mateus 7:24–27 encerra o Sermão do Monte (Mateus 5–7). Leia os ensinamentos anteriores para saber quais palavras Jesus chama os ouvintes a praticar.",[
    ["Ouvir é o começo, não o fim","Mateus 7:24 apresenta quem ouve as palavras de Jesus e as pratica como construtor prudente.","Escolha um ensino do Sermão do Monte e transforme-o em atitude observável."],
    ["A prática forma fundamento","A imagem da rocha está ligada explicitamente a ouvir e agir, não a prosperidade ou ausência de problemas.","Cultive hábitos que sustentem decisões coerentes antes dos momentos de crise."],
    ["As tempestades atingem as duas casas","Mateus 7:25–27 diz que chuva, enchentes e ventos atingem ambas; a diferença está no fundamento e no resultado.","Apoie quem enfrenta crises em vez de culpá-lo. Use a imagem como convite à formação, não como explicação simplista de tragédias."]]),
  localBibleStory("persistent-widow","A Viúva Persistente","Lucas 18:1–8",["viuva persistente","juiz injusto","parabola da viuva"],"Uma viúva pede repetidamente justiça a um juiz que não teme a Deus nem respeita pessoas. O juiz finalmente atende para não ser mais importunado; Jesus contrasta sua postura com a atenção de Deus.","Jesus encoraja perseverança na oração e confiança na justiça de Deus. O contraste não significa que Deus seja como o juiz injusto nem promete que todo pedido será atendido imediatamente.","Lucas 18:1 informa a finalidade do ensino: orar sempre e não desanimar. O versículo final pergunta se haverá fé quando o Filho do Homem vier.",[
    ["A viúva busca justiça apesar da indiferença","Lucas 18:2–5 mostra a vulnerabilidade da viúva e a persistência de seu pedido; o juiz é explicitamente injusto.","Escute quem pede justiça e leve a sério barreiras institucionais. Não atribua a demora à falta de fé de quem sofre."],
    ["Jesus distingue Deus do juiz injusto","Lucas 18:6–7 chama atenção para o contraste entre o juiz e Deus, que ouve os escolhidos.","A oração pode sustentar esperança e ação perseverante junto com apoio comunitário e caminhos responsáveis."],
    ["A parábola termina com uma pergunta sobre fé","Lucas 18:8 conecta o ensino à vinda do Filho do Homem e pergunta se haverá fé na terra.","Una oração a ações por justiça, sem transformar perseverança em passividade."]]),
  localBibleStory("rich-lazarus","O Rico e Lázaro (parábola)","Lucas 16:19–31",["rico e lazaro","lazaro pobre","parabola do rico e lazaro"],"Jesus conta a história de um rico que vive em banquetes e de Lázaro, pobre e coberto de feridas à sua porta. Após a morte, há uma inversão de condições; o diálogo final destaca Moisés e os Profetas.","A parábola denuncia indiferença diante do pobre e enfatiza ouvir as Escrituras. É outro Lázaro, distinto do irmão de Marta e Maria em João 11; tradições cristãs divergem sobre como interpretar as imagens do além.","Lucas 16:19–31 é uma parábola de Jesus em uma seção que trata de dinheiro e fidelidade. Não misture este personagem com a narrativa de João 11.",[
    ["A necessidade do pobre está à porta","Lucas 16:19–21 contrasta o banquete do rico com a fome e as feridas de Lázaro. O texto não o chama de amaldiçoado nem relata tentação pelo diabo.","Confronte a indiferença e organize cuidado concreto. Nunca trate pobreza, doença ou deficiência como prova de culpa espiritual."],
    ["A parábola inverte as condições","Lucas 16:22–26 relata a morte dos dois, a consolação de Lázaro e o sofrimento do rico. Leia as imagens dentro do gênero parabólico e reconheça diferenças interpretativas cristãs.","Reflita sobre justiça, riqueza e responsabilidade sem usar o texto para ameaçar pessoas enlutadas."],
    ["As Escrituras pedem resposta no presente","Lucas 16:27–31 termina com o pedido de advertir os irmãos e a resposta de Abraão sobre Moisés e os Profetas.","Responda ao ensino bíblico sobre misericórdia com uma ação concreta junto a pessoas necessitadas."]]),
  localBibleStory("zacchaeus","Zaqueu","Lucas 19:1–10",["zaqueu","jesus e zaqueu"],"Jesus vê Zaqueu, chefe dos cobradores de impostos, em uma árvore e anuncia que ficará em sua casa. A multidão reclama; Zaqueu anuncia partilha e restituição, e Jesus fala de salvação e busca do perdido.","O encontro com Jesus gera acolhimento e uma resposta concreta de justiça e reparação. A narrativa une graça e mudança de conduta.","Lucas 19:1–10 acontece em Jericó, durante a jornada de Jesus rumo a Jerusalém. Zaqueu é descrito como chefe dos cobradores de impostos e rico; a multidão murmura diante da visita.",[
    ["Jesus vê quem a multidão despreza","Lucas 19:1–7 relata que Jesus chama Zaqueu pelo nome e decide hospedar-se com ele, provocando reclamação.","Reconheça quem é tratado como indigno de atenção sem apagar a responsabilidade por danos causados."],
    ["A mudança aparece em partilha e restituição","Lucas 19:8 registra a decisão de dar metade dos bens aos pobres e restituir quatro vezes a quem foi defraudado.","Fale de arrependimento com reparação, transparência e mudança. Não generalize uma porcentagem como regra para todos."],
    ["Jesus declara sua missão de buscar o perdido","Lucas 19:9–10 conclui com a declaração sobre salvação naquela casa e o Filho do Homem que veio buscar e salvar o perdido.","Una graça e responsabilidade: acolha, acompanhe mudanças e proteja quem sofreu injustiça."]])
];
LOCAL_BIBLE_STORIES.push(
  localBibleStory("lazarus-bethany","Lázaro de Betânia","João 11:1–44",["lazaro de betania","ressurreicao de lazaro","jesus ressuscita lazaro"],"Lázaro, irmão de Marta e Maria, adoece e morre. Jesus encontra a família em luto, chora e o chama para fora do túmulo.","João apresenta Jesus como a ressurreição e a vida e mostra sua presença diante do luto. O relato não chama Lázaro de amaldiçoado nem diz que era tentado pelo diabo.","João 11:1–44 é a narrativa de Lázaro de Betânia. Lucas 16:19–31 traz outro personagem chamado Lázaro, dentro de uma parábola.",[
    ["O amor de Jesus não torna o sofrimento irreal","João 11:1–16 identifica a família e afirma que Jesus a amava; também relata a demora e a morte de Lázaro, sem explicá-las como maldição ou tentação demoníaca.","Acompanhe quem sofre sem inventar culpa nem prometer explicações para toda perda."],
    ["Jesus encontra a dor e chama à confiança","João 11:17–37 apresenta a confissão de Marta, o choro de Maria e Jesus chorando com a família. Fé e lamento aparecem juntos.","Permita que a comunidade lamente com honestidade e ofereça presença prática, sem censurar lágrimas."],
    ["O sinal aponta para a vida que Jesus dá","João 11:38–44 narra a pedra removida, o chamado de Jesus e a saída de Lázaro. O texto não promete a mesma restauração física imediata a toda família enlutada.","Proclame esperança sem prometer resultados que o texto não garante e participe do cuidado de quem sofre."]]),
  localBibleStory("daniel-lions","Daniel na Cova dos Leões","Daniel 6:1–28",["daniel na cova dos leoes","cova dos leoes","daniel e os leoes"],"Autoridades armam uma lei contra Daniel, que continua orando. Ele é lançado na cova dos leões e o rei o encontra vivo pela manhã.","O capítulo encoraja fidelidade e narra o livramento de Daniel. Não promete que todas as pessoas fiéis escaparão de perseguição ou perigo da mesma forma.","Daniel 6 descreve uma conspiração política e um decreto que proíbe petições a qualquer deus ou pessoa além do rei por trinta dias.",[
    ["A fidelidade de Daniel é observada","Daniel 6:1–10 descreve sua competência, a conspiração dos administradores e a continuidade da oração após o decreto.","Mantenha convicções com responsabilidade e busque apoio quando regras injustas colocarem alguém em risco."],
    ["A fé é usada como alvo de uma conspiração","Daniel 6:11–18 mostra os conspiradores usando a prática de Daniel para acusá-lo, e o rei preso ao próprio decreto.","Identifique abusos de poder e proteja pessoas vulneráveis; não romantize o risco nem recomende permanecer em perigo sem apoio."],
    ["O relato testemunha o livramento de Daniel","Daniel 6:19–28 narra que Daniel é encontrado vivo e que o rei reconhece o Deus de Daniel.","Agradeça por livramentos sem transformá-los em garantia universal e acompanhe quem enfrenta perseguição."]]),
  localBibleStory("jonah","Jonas","Jonas 1–4",["jonas e o grande peixe","jonas em nínive","profeta jonas"],"Jonas foge de sua missão, enfrenta uma tempestade, é engolido por um grande peixe, prega em Nínive e se irrita quando a cidade se arrepende e recebe misericórdia.","O livro confronta a resistência do profeta à compaixão de Deus por Nínive e termina com uma pergunta sobre misericórdia. O texto diz grande peixe; não especifica uma baleia.","Jonas 1–4 forma uma narrativa completa. A mudança de Nínive e a reação final de Jonas são necessárias para entender o livro; não pare a mensagem apenas no peixe.",[
    ["A fuga do profeta não cancela a missão","Jonas 1 descreve a tentativa de fugir e a tempestade; Jonas 2 traz sua oração dentro do peixe.","Reconheça resistências e procure responder com responsabilidade, sem atribuir todo sofrimento a uma punição individual."],
    ["Nínive responde à mensagem","Jonas 3 narra a proclamação do profeta e o arrependimento da cidade; Deus vê a mudança e não executa o juízo anunciado.","Valorize mudança real e não use a mensagem para justificar hostilidade contra povos ou culturas."],
    ["A misericórdia de Deus confronta Jonas","Jonas 4 mostra a ira do profeta e a lição da planta; o livro termina com uma pergunta de Deus sobre a cidade.","Examine se ressentimento impede compaixão e amplie o cuidado para além do próprio grupo."]])
);
// Catálogo ampliado: parábolas de Jesus e narrativas parabólicas/proféticas do AT.
LOCAL_BIBLE_STORIES.push(
  localBibleStory("lamp-on-stand","A Candeia no Velador","Mateus 5:14–16; Marcos 4:21–25; Lucas 8:16–18",["candeia no velador","luz debaixo do alqueire","lampada no velador","luz do mundo"],"Jesus compara seus discípulos a uma luz que não deve ser escondida, mas colocada onde ilumine a casa.","O testemunho visível deve conduzir as pessoas a reconhecerem o bem e glorificarem o Pai.","Mateus situa a imagem no Sermão do Monte; Marcos e Lucas a relacionam à responsabilidade de ouvir e acolher a palavra.",[["A identidade recebida aponta para o testemunho","Mateus 5:14 chama os discípulos de luz do mundo, logo após as bem-aventuranças.","Viva os valores de Jesus em ações concretas, sem buscar prestígio pessoal."],["A luz existe para servir a todos","Mateus 5:15 descreve a candeia colocada no lugar apropriado para iluminar.","Identifique uma forma de serviço que torne o cuidado e a justiça visíveis."],["O bem aponta para Deus","Mateus 5:16 liga as boas obras à glória do Pai.","Pratique o bem sem transformar serviço em propaganda ou superioridade."]]),
  localBibleStory("two-debtors","Os Dois Devedores","Lucas 7:36–50",["dois devedores","dois credores","simão fariseu","mulher pecadora e jesus"],"Na casa de Simão, Jesus conta a história de dois devedores perdoados por um credor; a conversa interpreta o gesto de uma mulher que demonstra amor.","A parábola relaciona perdão reconhecido e amor, e expõe o julgamento de Simão sem reduzir a mulher a um rótulo.","Lucas 7:36–50 contrapõe a recepção de Simão e a ação da mulher. Jesus fala do perdão e da fé no encerramento.",[["Leia o encontro antes da comparação","Lucas 7:36–39 mostra Simão julgando a mulher e Jesus permitindo que ela se aproxime.","Evite resumir alguém ao passado; examine a hospitalidade que a comunidade oferece."],["A dívida ajuda a interpretar o amor","Lucas 7:40–43 apresenta dois valores de dívida e pergunta quem amará mais após o perdão.","Reconheça a graça sem medir ou competir sobre quem seria mais digno."],["Jesus questiona o julgamento e acolhe a fé","Lucas 7:44–50 compara os gestos da mulher com a recepção de Simão.","Pratique gratidão, acolhimento e responsabilidade sem usar o texto para silenciar pessoas vulneráveis."]]),
  localBibleStory("children-market","As Crianças na Praça","Mateus 11:16–19; Lucas 7:31–35",["crianças na praça","meninos nas praças","flauta e lamentação","geração desta época"],"Jesus compara seus ouvintes a crianças que reclamam porque os outros não respondem nem à música alegre nem ao lamento.","A comparação denuncia a recusa em ouvir tanto João Batista quanto Jesus, apesar de seus modos diferentes.","Mateus 11 e Lucas 7 situam a imagem após a pergunta dos discípulos de João e a avaliação de Jesus sobre aquela geração.",[["Observe a crítica à falta de resposta","A imagem descreve crianças insatisfeitas com qualquer brincadeira proposta.","Pergunte se expectativas rígidas impedem escutar mensagens que desafiam o grupo."],["João e Jesus têm estilos diferentes","João vem em austeridade e Jesus participa de refeições; ambos são criticados.","Avalie uma mensagem pelo conteúdo e pelos frutos, não só pela preferência de estilo."],["A sabedoria é reconhecida pelos frutos","Mateus 11:19 e Lucas 7:35 concluem com a vindicação da sabedoria.","Examine com humildade os resultados éticos e relacionais de uma prática religiosa."]]),
  localBibleStory("patch-old-cloth","O Remendo de Pano Novo","Mateus 9:16; Marcos 2:21; Lucas 5:36",["remendo novo em roupa velha","pano novo","remendo de tecido novo"],"Jesus compara um remendo de pano novo numa roupa velha ao desajuste de tentar combinar práticas incompatíveis.","A imagem responde à pergunta sobre o jejum e anuncia que a presença de Jesus exige discernir o tempo novo que chegou.","A comparação aparece nas discussões sobre jejum, junto da imagem dos odres. Lucas explicita o prejuízo causado pelo remendo.",[["Leia a pergunta sobre o jejum","Marcos 2:18–20 registra a questão que provoca as imagens.","Interprete a comparação no diálogo original, sem usá-la como desculpa para desprezar toda tradição."],["Perceba o desajuste da imagem","O remendo não encolhido danifica a roupa velha.","Pergunte que mudanças de prática são necessárias para responder fielmente ao que Jesus ensina."],["Discernir novidade também exige cuidado","Lucas 5:39 observa a preferência pelo vinho velho, acrescentando nuance à comparação.","Converse sobre mudança com paciência, sem caricaturar pessoas que precisam de tempo."]]),
  localBibleStory("new-wineskins","O Vinho Novo e os Odres","Mateus 9:17; Marcos 2:22; Lucas 5:37–39",["vinho novo em odres novos","odres velhos","vinho novo","odres"],"Jesus diz que vinho novo deve ser colocado em odres novos, pois a fermentação rompe recipientes antigos e perde o vinho.","A imagem, no debate sobre jejum, comunica que a novidade da missão de Jesus não cabe sem discernimento em formas inadequadas.","A passagem faz parte da resposta de Jesus sobre jejum; Lucas 5:39 acrescenta a observação sobre a preferência pelo antigo.",[["Identifique a questão do contexto","A discussão começa com a pergunta sobre por que os discípulos não jejuam como outros grupos.","Não aplique a imagem a qualquer novidade sem explicar o assunto do texto."],["A forma precisa acolher o conteúdo","Odres novos preservam o vinho em fermentação na imagem de Jesus.","Revise estruturas que dificultam cuidado, justiça e participação, preservando o que é fiel e bom."],["Lucas reconhece a força do hábito","Lucas 5:39 observa que quem provou o vinho velho pode preferi-lo.","Conduza mudanças com escuta, ensino e tempo, sem desprezar pessoas ou tradições automaticamente."]]),
  localBibleStory("mustard-seed","O Grão de Mostarda","Mateus 13:31–32; Marcos 4:30–32; Lucas 13:18–19",["grao de mostarda","grão de mostarda","semente de mostarda","reino como grao de mostarda"],"Jesus compara o Reino de Deus a uma semente muito pequena que cresce e se torna uma planta grande, oferecendo abrigo às aves.","A imagem contrasta começos modestos com o crescimento do Reino e sugere alcance e acolhimento.","Mateus e Marcos colocam a parábola entre ensinos sobre o Reino; Lucas a associa à cura e à discussão sobre o sábado.",[["Começos pequenos não devem ser desprezados","A semente é apresentada como pequena diante do resultado que alcança.","Valorize ações fiéis e modestas sem prometer sucesso imediato ou grandeza institucional."],["O crescimento pertence à imagem do Reino","A planta cresce até se tornar maior que as hortaliças ao redor.","Cultive práticas que amadureçam com constância e responsabilidade."],["A árvore oferece espaço","Marcos 4:32 menciona aves abrigadas à sombra.","Pergunte se a comunidade se torna lugar de acolhimento e proteção para outras pessoas."]]),
  localBibleStory("leaven","O Fermento na Massa","Mateus 13:33; Lucas 13:20–21",["fermento na massa","parabola do fermento","mulher e fermento"],"Uma mulher mistura fermento numa grande quantidade de farinha até toda a massa ficar levedada.","A imagem destaca a ação abrangente do Reino, que transforma a massa por dentro, mesmo sem começar de modo aparente.","Em Mateus aparece junto às parábolas do Reino; Lucas a coloca ao lado do grão de mostarda.",[["O Reino age de modo discreto","O fermento fica misturado na massa e não é visto de fora.","Reconheça processos de transformação que começam em hábitos cotidianos."],["A ação alcança o conjunto","A massa toda fica levedada.","Planeje mudanças que alcancem relações e práticas, não só a aparência pública."],["A imagem convida à esperança paciente","A parábola não descreve um resultado instantâneo.","Sustente o trabalho contínuo sem confundir paciência com passividade diante da injustiça."]]),
  localBibleStory("growing-seed","A Semente que Cresce Sozinha","Marcos 4:26–29",["semente que cresce sozinha","semente cresce por si","semeador noite e dia"],"Um homem lança a semente e acompanha o ciclo: a terra produz, primeiro o broto, depois a espiga e o grão maduro.","A parábola enfatiza o crescimento do Reino que não está sob controle total do semeador e culmina na colheita.","Marcos 4:26–29 é uma parábola exclusiva desse Evangelho, entre o ensino do semeador e o grão de mostarda.",[["O semeador participa do trabalho","O homem lança a semente e depois acompanha o campo.","Faça sua parte com fidelidade sem reivindicar controle absoluto sobre a vida de outras pessoas."],["O crescimento tem etapas","Marcos descreve broto, espiga e grão cheio.","Respeite processos de aprendizagem e amadurecimento."],["A colheita aponta para responsabilidade e esperança","Quando o fruto amadurece, chega o tempo da ceifa.","Celebre frutos reais e avalie o trabalho com humildade e discernimento."]]),
  localBibleStory("weeds-wheat","O Joio e o Trigo","Mateus 13:24–30, 36–43",["joio e trigo","joio no meio do trigo","parabola do joio"],"Um homem semeia trigo, mas um inimigo planta joio. O dono impede que os servos arranquem as plantas antes da colheita para não danificar o trigo.","A explicação de Jesus associa a parábola ao Reino e ao juízo final, advertindo contra julgamentos precipitados antes do tempo de Deus.","Mateus 13:36–43 oferece a interpretação da parábola; leia junto da parábola do semeador e da rede.",[["Há mistura no campo","O trigo e o joio crescem juntos até a colheita.","Reconheça problemas sem se atribuir o papel de juiz final sobre pessoas."],["A pressa pode causar dano","Os servos são impedidos de arrancar o joio para não arrancar também o trigo.","Avalie consequências e proteja pessoas vulneráveis antes de propor medidas disciplinares."],["A interpretação aponta para o juízo de Deus","Mateus 13:36–43 fornece os símbolos e o horizonte do ensino.","Deixe o juízo final a Deus e pratique correção comunitária com justiça, evidências e cuidado."]]),
  localBibleStory("hidden-treasure","O Tesouro Escondido","Mateus 13:44",["tesouro escondido no campo","tesouro escondido","tesouro no campo"],"Um homem encontra um tesouro escondido num campo, volta a esconder e, cheio de alegria, vende o que tem para comprar o campo.","A parábola expressa o valor incomparável do Reino e a resposta alegre de quem o reconhece.","Mateus 13:44 integra uma série de parábolas curtas sobre o Reino dos Céus.",[["O tesouro é descoberto","A narrativa começa com um encontro inesperado no campo.","Converse sobre o que o texto apresenta como valioso, sem equiparar fé a enriquecimento."],["A alegria orienta a decisão","O homem age cheio de alegria, não por coerção.","Relacione compromisso a convicção e liberdade responsável."],["O Reino reorganiza prioridades","A venda de tudo ilustra a importância do tesouro encontrado.","Examine prioridades à luz do Reino sem exigir abandono irresponsável de deveres familiares ou materiais."]]),

const PRP_PLAN_STORAGE_KEY="prp-reading-plan-v1";
const PRP_GLOSSARY_ENTRIES=[
{term:"Aliança",definition:"Compromisso estabelecido entre Deus e pessoas ou povos. A Bíblia apresenta várias alianças e destaca a nova aliança anunciada pelos profetas e celebrada por Jesus.",refs:"Gênesis 9:8–17; Jeremias 31:31–34; Lucas 22:20"},
{term:"Aleluia",definition:"Expressão de louvor que significa “louvem o Senhor”. Aparece especialmente em cânticos e salmos de adoração.",refs:"Salmos 146–150; Apocalipse 19:1–6"},
{term:"Amém",definition:"Palavra de afirmação que comunica concordância, confiança ou o desejo de que algo se cumpra. O sentido depende do contexto.",refs:"Números 5:22; 1 Coríntios 14:16; Apocalipse 22:20"},
{term:"Apóstolo",definition:"Enviado ou representante. No Novo Testamento, é usado especialmente para pessoas comissionadas por Jesus para anunciar o evangelho.",refs:"Marcos 3:14; Atos 1:21–26; 1 Coríntios 15:7"},
{term:"Arrependimento",definition:"Reconhecer o pecado e voltar-se para Deus. A Bíblia relaciona arrependimento à fé e a uma vida transformada.",refs:"Marcos 1:15; Atos 3:19; 2 Coríntios 7:10"},
{term:"Batismo",definition:"Rito cristão com água, ligado à confissão de fé e à vida da comunidade. Tradições cristãs explicam de formas diferentes sua relação com a graça.",refs:"Mateus 28:19; Atos 2:38–41; Romanos 6:3–4"},
{term:"Bem-aventurança",definition:"Declaração de bênção ou felicidade diante de Deus. Nos Evangelhos, aparece com destaque nos ensinamentos de Jesus.",refs:"Mateus 5:3–12; Lucas 6:20–23"},
{term:"Discípulo",definition:"Aluno e seguidor. Nos Evangelhos, descreve quem aprende com Jesus e é chamado a viver e anunciar seus ensinamentos.",refs:"Lucas 9:23; João 8:31; João 13:35"},
{term:"Evangelho",definition:"“Boa notícia”. No Novo Testamento, refere-se à mensagem sobre Jesus e também aos quatro livros que narram sua vida e seu ministério.",refs:"Marcos 1:1; Romanos 1:16; 1 Coríntios 15:1–4"},
{term:"Expiação",definition:"Termo usado para falar do tratamento do pecado e da reconciliação com Deus. A Bíblia usa diferentes imagens para esse tema.",refs:"Levítico 16; Romanos 3:23–26; Hebreus 9:11–14"},
{term:"Fé",definition:"Confiança e fidelidade. No Novo Testamento, descreve a confiança em Deus e em Jesus, vivida em resposta à mensagem recebida.",refs:"Habacuque 2:4; Romanos 10:9–17; Hebreus 11:1"},
{term:"Graça",definition:"Favor e bondade concedidos por Deus. Nas cartas do Novo Testamento, a salvação é frequentemente descrita como dádiva da graça.",refs:"Romanos 3:24; Efésios 2:8–10; Tito 2:11–14"},
{term:"Igreja",definition:"Assembleia ou comunidade cristã. No Novo Testamento, pode indicar uma comunidade local ou o povo de Cristo, não apenas um edifício.",refs:"Mateus 16:18; Atos 2:42–47; 1 Coríntios 12:27"},
{term:"Jejum",definition:"Abstinência voluntária de alimento por um período, geralmente ligada à oração, busca de Deus, lamento ou arrependimento.",refs:"Isaías 58:3–7; Mateus 6:16–18; Atos 13:2–3"},
{term:"Justificação",definition:"Linguagem bíblica sobre ser declarado justo diante de Deus. Paulo a relaciona à graça e à fé; tradições cristãs explicam de modos distintos sua relação com a transformação da vida.",refs:"Romanos 3:21–28; Romanos 5:1; Tiago 2:24"},
{term:"Messias",definition:"“Ungido”. Título associado à esperança de um rei ou libertador escolhido por Deus. Cristo é a forma grega do título.",refs:"Salmos 2:2; João 1:41; João 4:25–26"},
{term:"Misericórdia",definition:"Compaixão que se expressa em cuidado e ajuda. É atribuída a Deus e também ensinada como prática entre as pessoas.",refs:"Êxodo 34:6; Lucas 10:25–37; Efésios 2:4–5"},
{term:"Parábola",definition:"Narrativa ou comparação breve usada para ensinar. Jesus emprega parábolas para levar os ouvintes a refletir sobre o Reino de Deus.",refs:"Mateus 13:10–17; Marcos 4:33–34"},
{term:"Pecado",definition:"Ações, desejos ou condições que se opõem à vontade de Deus e prejudicam a relação com ele e com o próximo. A Bíblia também fala de perdão e restauração.",refs:"Gênesis 3; Romanos 3:23; 1 João 1:8–9"},
{term:"Pentecostes",definition:"Festa judaica celebrada cinquenta dias após a Páscoa. Em Atos 2, os discípulos recebem o Espírito Santo e anunciam a mensagem em várias línguas.",refs:"Levítico 23:15–21; Atos 2:1–13"},
{term:"Profeta",definition:"Pessoa chamada para transmitir uma mensagem de Deus. Os profetas também confrontam injustiças e chamam o povo à fidelidade.",refs:"Deuteronômio 18:18; Jeremias 1:4–10; Atos 3:22–23"},
{term:"Redenção",definition:"Libertação descrita com a imagem de resgate. O Novo Testamento usa o termo para falar da libertação do pecado por meio de Cristo.",refs:"Êxodo 6:6; Marcos 10:45; Efésios 1:7"},
{term:"Reino de Deus",definition:"A ação soberana de Deus e a realidade em que sua vontade é reconhecida. Jesus anuncia o Reino e ensina seus discípulos a orar por sua vinda.",refs:"Marcos 1:14–15; Mateus 6:9–10; Lucas 17:20–21"},
{term:"Ressurreição",definition:"Volta à vida. A ressurreição de Jesus é apresentada no Novo Testamento como fundamento da esperança cristã na vida futura.",refs:"João 11:25–26; 1 Coríntios 15:12–22"},
{term:"Salvação",definition:"Livramento e restauração. Na Bíblia, pode se referir à libertação de perigos e, especialmente no Novo Testamento, à reconciliação com Deus.",refs:"Êxodo 14:13; Lucas 19:9–10; Efésios 2:8–10"},
{term:"Santificação",definition:"Ser separado para Deus e crescer em uma vida coerente com essa relação. O Novo Testamento fala da santificação como obra de Deus e chamado à prática.",refs:"João 17:17; 1 Tessalonicenses 4:3; Hebreus 10:10"},
{term:"Sábado",definition:"Dia de descanso no ciclo semanal judaico, ligado à criação e à libertação do Egito. Jesus também debateu como praticá-lo com misericórdia.",refs:"Êxodo 20:8–11; Deuteronômio 5:12–15; Marcos 2:27–28"},
{term:"Sacerdote",definition:"Pessoa que exercia serviço religioso no antigo Israel. O Novo Testamento também usa imagens sacerdotais para falar de Cristo e da comunidade.",refs:"Êxodo 28; Hebreus 4:14–16; 1 Pedro 2:9"},
{term:"Sinagoga",definition:"Local de reunião judaica para oração, leitura e ensino das Escrituras. Jesus e os primeiros discípulos frequentavam sinagogas.",refs:"Lucas 4:16–21; Atos 13:14–15"},
{term:"Testamento",definition:"No nome “Antigo e Novo Testamento”, significa aliança e designa as duas grandes partes da Bíblia cristã.",refs:"Êxodo 24:7–8; Jeremias 31:31–34; 2 Coríntios 3:6"},
{term:"Trindade",definition:"Termo teológico cristão para expressar a fé em um só Deus: Pai, Filho e Espírito Santo. A palavra não aparece na Bíblia; a doutrina é formulada a partir de vários textos.",refs:"Mateus 28:19; João 1:1–14; 2 Coríntios 13:13"},
{term:"Unção",definition:"Ato de aplicar óleo, associado em diferentes passagens à consagração, cura ou hospitalidade. O sentido deve ser identificado no contexto.",refs:"1 Samuel 16:13; Salmos 23:5; Tiago 5:14"},
{term:"Vocação",definition:"Chamado ou convite para servir a Deus e ao próximo. Pode se referir a uma missão específica ou à vida cristã em geral.",refs:"Êxodo 3:1–12; Marcos 1:16–20; Efésios 4:1"},
{term:"Zelo",definition:"Dedicação intensa ou cuidado por algo importante. A Bíblia elogia o zelo acompanhado de conhecimento e amor, e alerta contra o zelo sem entendimento.",refs:"Números 25:11; Romanos 10:2; 1 Coríntios 13:4–7"}
,
{"term":"Abba","definition":"Palavra aramaica de tratamento familiar para pai. O Novo Testamento a preserva em orações e ao falar da relação dos cristãos com Deus.","refs":"Marcos 14:36; Romanos 8:15; Gálatas 4:6"},
{"term":"Abraão","definition":"Patriarca chamado por Deus, com quem foi estabelecida uma aliança e a promessa de bênção para as famílias da terra.","refs":"Gênesis 12:1–3; 15:1–6; 22:1–18"},
{"term":"Adão","definition":"Primeiro ser humano na narrativa de Gênesis; no Novo Testamento, também aparece em reflexões sobre pecado e morte.","refs":"Gênesis 2:7; 3:17–19; Romanos 5:12–19"},
{"term":"Adoração","definition":"Resposta de reverência, louvor e serviço a Deus, expressa tanto em atos de culto quanto na vida cotidiana.","refs":"Salmos 95:6; João 4:23–24; Romanos 12:1"},
{"term":"Altar","definition":"Estrutura usada para apresentar sacrifícios ou ofertas e, em algumas passagens, marcar um lugar de culto ou memorial.","refs":"Gênesis 8:20; Êxodo 27:1–8; Hebreus 13:10"},
{"term":"Anjo","definition":"Mensageiro de Deus. Nas narrativas bíblicas, anjos comunicam mensagens e cumprem tarefas recebidas de Deus.","refs":"Gênesis 16:7–13; Lucas 1:26–38; Hebreus 1:14"},
{"term":"Arca da Aliança","definition":"Caixa sagrada associada à aliança e à presença de Deus entre Israel; guardava as tábuas da aliança.","refs":"Êxodo 25:10–22; Josué 3:3–6; Hebreus 9:4"},
{"term":"Árvore da vida","definition":"Árvore do jardim do Éden associada à vida; volta a aparecer como imagem de vida e restauração em Provérbios e Apocalipse.","refs":"Gênesis 2:9; Provérbios 3:18; Apocalipse 22:2"},
{"term":"Ascensão","definition":"Subida de Jesus ao céu após as aparições aos discípulos, conforme narrada no início de Atos.","refs":"Lucas 24:50–53; Atos 1:6–11; Efésios 4:8–10"},
{"term":"Autoridade","definition":"Poder ou direito de dirigir, ensinar ou agir. A Bíblia fala da autoridade de Deus, de Jesus e de autoridades humanas.","refs":"Mateus 28:18; João 19:10–11; Romanos 13:1–7"},
{"term":"Babel","definition":"Cidade ligada à narrativa da torre e à dispersão dos povos; o nome é associado à confusão das línguas.","refs":"Gênesis 10:10; 11:1–9"},
{"term":"Babilônia","definition":"Império e cidade que conquistaram Judá e levaram parte de sua população ao exílio; em Apocalipse, também é imagem de poder opressor.","refs":"2 Reis 25:1–12; Salmos 137:1–6; Apocalipse 18:1–8"},
{"term":"Barnabé","definition":"Discípulo cristão conhecido por encorajar outros e acompanhar Paulo em parte de suas viagens missionárias.","refs":"Atos 4:36–37; 9:26–27; 11:22–26"},
{"term":"Bênção","definition":"Favor, cuidado ou prosperidade atribuídos a Deus. A Bíblia também registra bênçãos pronunciadas sobre pessoas e povos.","refs":"Gênesis 12:2–3; Números 6:24–26; Efésios 1:3"},
{"term":"Betânia","definition":"Aldeia próxima de Jerusalém associada a Marta, Maria e Lázaro; Jesus também passou ali antes de sua entrada em Jerusalém.","refs":"Lucas 10:38–42; João 11:1–18; 12:1–8"},
{"term":"Betel","definition":"Lugar cujo nome significa “casa de Deus”, associado ao sonho de Jacó e a acontecimentos posteriores da história de Israel.","refs":"Gênesis 28:10–22; 35:1–7; 1 Reis 12:28–29"},
{"term":"Boas-novas","definition":"Notícia de algo bom. No Novo Testamento, a expressão está ligada ao anúncio do Reino de Deus e de Jesus.","refs":"Isaías 52:7; Marcos 1:14–15; Romanos 10:15"},
{"term":"Caim","definition":"Filho de Adão e Eva que, segundo Gênesis, matou seu irmão Abel; sua história é retomada em outros textos bíblicos.","refs":"Gênesis 4:1–16; Hebreus 11:4; 1 João 3:12"},
{"term":"Cânon bíblico","definition":"Conjunto de livros reconhecidos como Escritura pelas comunidades judaicas e cristãs. As tradições cristãs têm diferenças na lista de alguns livros.","refs":"Lucas 24:44; 2 Timóteo 3:15–17; 2 Pedro 3:15–16"},
{"term":"Cativeiro","definition":"Prisão ou deportação de pessoas e povos. A Bíblia destaca especialmente o exílio de Judá na Babilônia e o retorno posterior.","refs":"2 Reis 25:8–21; Jeremias 29:10–14; Esdras 1:1–4"},
{"term":"Céu","definition":"Pode designar o firmamento, o lugar de Deus ou a esperança futura, conforme o contexto da passagem.","refs":"Gênesis 1:1; Mateus 6:9; Apocalipse 21:1"},
{"term":"Circuncisão","definition":"Sinal da aliança de Deus com Abraão e seus descendentes; no Novo Testamento, também é discutida em relação à fé e à vida cristã.","refs":"Gênesis 17:9–14; Romanos 2:28–29; Gálatas 5:6"},
{"term":"Cordeiro de Deus","definition":"Título aplicado a Jesus no Evangelho de João e imagem de sacrifício e vitória usada em Apocalipse.","refs":"Isaías 53:7; João 1:29; Apocalipse 5:6–13"},
{"term":"Consciência","definition":"Percepção interior que pode aprovar ou acusar as ações de alguém; as cartas ensinam a buscar uma consciência limpa diante de Deus.","refs":"Atos 24:16; Romanos 2:14–15; Hebreus 9:14"},
{"term":"Consolador","definition":"Título usado no Evangelho de João para o Espírito Santo, que ensina, testemunha e auxilia os discípulos.","refs":"João 14:16–17; 15:26; 16:7–13"},
{"term":"Criação","definition":"A obra de Deus ao criar o mundo e tudo o que nele existe; também pode designar o conjunto das criaturas.","refs":"Gênesis 1:1–31; Salmos 104:24–30; João 1:1–3"},
{"term":"Cruz","definition":"Instrumento romano de execução no qual Jesus foi morto; no Novo Testamento, tornou-se central para a mensagem cristã.","refs":"Marcos 15:21–39; 1 Coríntios 1:18; Gálatas 6:14"},
{"term":"Daniel","definition":"Judeu levado à Babilônia que aparece em narrativas de fidelidade e em visões sobre reinos e o futuro.","refs":"Daniel 1:6–21; 6:1–28; 7:1–14"},
{"term":"Decálogo","definition":"Nome dado aos Dez Mandamentos transmitidos a Israel no contexto da aliança.","refs":"Êxodo 20:1–17; Deuteronômio 5:6–21"},
{"term":"Demônio","definition":"Espírito maligno mencionado nos Evangelhos e em outros textos; as narrativas descrevem Jesus libertando pessoas de sua opressão.","refs":"Marcos 1:23–27; 5:1–20; Lucas 8:2"},
{"term":"Deserto","definition":"Região árida que serve de cenário a provações, libertação e encontro com Deus em várias narrativas bíblicas.","refs":"Êxodo 16:1–15; Deuteronômio 8:2–5; Marcos 1:12–13"},
{"term":"Diácono","definition":"Servo ou ministro da comunidade cristã. Atos descreve a escolha de pessoas para atender necessidades da comunidade; cartas posteriores apresentam qualificações para o serviço.","refs":"Atos 6:1–6; Filipenses 1:1; 1 Timóteo 3:8–13"},
{"term":"Dízimo","definition":"Décima parte de produtos ou rendimentos, mencionada em práticas religiosas de Israel e em discussões posteriores.","refs":"Gênesis 14:18–20; Levítico 27:30–32; Malaquias 3:10; Hebreus 7:1–10"},
{"term":"Dons espirituais","definition":"Capacidades e serviços que, segundo as cartas do Novo Testamento, são concedidos para edificar a comunidade.","refs":"Romanos 12:6–8; 1 Coríntios 12:4–11; 1 Pedro 4:10–11"},
{"term":"Doutrina","definition":"Ensino ou conjunto de ensinamentos. A Bíblia incentiva o ensino fiel e a prática coerente com ele.","refs":"Atos 2:42; 2 Timóteo 3:16–17; Tito 2:1"},
{"term":"Doxologia","definition":"Expressão breve de louvor e glória a Deus, frequentemente usada ao final de orações ou cartas.","refs":"Romanos 11:33–36; Efésios 3:20–21; Judas 24–25"},
{"term":"Éden","definition":"Jardim onde, segundo Gênesis, Deus colocou o primeiro casal humano.","refs":"Gênesis 2:8–15; 3:23–24; Ezequiel 28:13"},
{"term":"Eleição","definition":"Escolha atribuída a Deus em diferentes passagens, relacionada a pessoas, povos ou serviço. As tradições cristãs interpretam sua relação com a liberdade de modos diversos.","refs":"Deuteronômio 7:6–8; Efésios 1:4–5; 1 Pedro 1:1–2"},
{"term":"Elias","definition":"Profeta de Israel que confrontou a idolatria no reinado de Acabe e aparece também em narrativas sobre milagres e vocação profética.","refs":"1 Reis 17:1–7; 18:17–39; 2 Reis 2:9–11"},
{"term":"Eliseu","definition":"Profeta que sucedeu Elias e cuja atuação é narrada especialmente em 2 Reis.","refs":"1 Reis 19:19–21; 2 Reis 2:9–15; 5:1–14"},
{"term":"Encarnação","definition":"Termo cristão para a crença de que o Filho de Deus assumiu a natureza humana em Jesus.","refs":"João 1:1–14; Filipenses 2:6–8; Hebreus 2:14–17"},
{"term":"Epístola","definition":"Carta, especialmente as cartas do Novo Testamento dirigidas a igrejas ou pessoas.","refs":"Romanos 1:1–7; 1 Coríntios 1:1–3; 2 Pedro 3:1"},
{"term":"Esperança","definition":"Confiança voltada para o cumprimento das promessas de Deus e para o futuro que ele anuncia.","refs":"Romanos 5:1–5; 8:24–25; Hebreus 6:19"},
{"term":"Espírito Santo","definition":"Espírito de Deus, que aparece desde a criação e, no Novo Testamento, ensina, consola e capacita os discípulos.","refs":"Gênesis 1:2; João 14:16–17; Atos 2:1–4"},
{"term":"Êxodo","definition":"Saída dos israelitas do Egito, evento central da memória de libertação de Israel; também é o nome do segundo livro da Bíblia.","refs":"Êxodo 12:31–42; 14:21–31; 20:2"},
{"term":"Exílio","definition":"Deportação de habitantes de Israel ou Judá para outras terras, especialmente após as conquistas assíria e babilônica.","refs":"2 Reis 17:6; 25:8–21; Jeremias 29:10–14"},
{"term":"Fariseu","definition":"Integrante de um movimento judaico do período do Segundo Templo, conhecido por sua atenção à interpretação e à prática da Lei.","refs":"Mateus 23:1–7; Marcos 7:1–13; Atos 23:6–9"},
{"term":"Faraó","definition":"Título dos reis do Egito. O faraó do Êxodo se opõe à saída dos israelitas, segundo a narrativa bíblica.","refs":"Êxodo 1:8–14; 5:1–2; 14:5–31"},
{"term":"Fidelidade","definition":"Lealdade e constância. A Bíblia descreve Deus como fiel e chama as pessoas à fidelidade.","refs":"Deuteronômio 7:9; Salmos 89:1–2; Gálatas 5:22"},
{"term":"Filisteus","definition":"Povo que viveu na região costeira de Canaã e aparece como adversário de Israel em várias narrativas.","refs":"Juízes 13:1; 1 Samuel 17:1–11; 2 Samuel 5:17–25"},
{"term":"Filiação","definition":"Relação de filhos com Deus, usada no Novo Testamento para falar da adoção e da herança dos que pertencem a Cristo.","refs":"Romanos 8:15–17; Gálatas 4:4–7; Efésios 1:5"},
{"term":"Filho do Homem","definition":"Expressão usada por Jesus para falar de si; também remete à figura humana e régia da visão de Daniel.","refs":"Daniel 7:13–14; Marcos 10:45; Mateus 26:64"},
{"term":"Fogo","definition":"Imagem literal e simbólica na Bíblia: pode representar presença, purificação, juízo ou paixão, conforme o contexto.","refs":"Êxodo 3:2; Levítico 9:24; Atos 2:3"},
{"term":"Fruto do Espírito","definition":"Lista de qualidades que Paulo associa à vida conduzida pelo Espírito Santo.","refs":"Gálatas 5:16–25"},
{"term":"Galileia","definition":"Região ao norte de Israel, cenário de grande parte do ministério de Jesus.","refs":"Isaías 9:1–2; Mateus 4:12–16; Marcos 1:14–20"},
{"term":"Geena","definition":"Termo grego ligado ao vale de Hinom, usado por Jesus em advertências sobre o juízo.","refs":"Mateus 5:22, 29–30; Marcos 9:43–48; Tiago 3:6"},
{"term":"Gentio","definition":"Pessoa que não pertence ao povo judeu. O Novo Testamento descreve a inclusão dos gentios na comunidade cristã.","refs":"Gênesis 12:3; Atos 10:34–48; Efésios 2:11–22"},
{"term":"Getsêmani","definition":"Jardim ou lugar no monte das Oliveiras onde Jesus orou antes de ser preso.","refs":"Mateus 26:36–46; Marcos 14:32–42; João 18:1"},
{"term":"Glória","definition":"Esplendor, honra ou manifestação da presença de Deus. A palavra também descreve a honra dada a pessoas.","refs":"Êxodo 33:18–23; João 1:14; Romanos 8:18"},
{"term":"Gólgota","definition":"Nome do lugar onde Jesus foi crucificado; os Evangelhos explicam o nome como “Lugar da Caveira”.","refs":"Mateus 27:33; Marcos 15:22; João 19:17"},
{"term":"Gênesis","definition":"Primeiro livro da Bíblia, com narrativas sobre a criação, os patriarcas e o início da história de Israel.","refs":"Gênesis 1:1; 12:1–3; 50:24–26"},
{"term":"Habacuque","definition":"Profeta que questiona a injustiça e recebe uma resposta sobre confiança e fidelidade.","refs":"Habacuque 1:2–4; 2:2–4; 3:17–19"},
{"term":"Hades","definition":"Termo grego usado no Novo Testamento para o domínio ou estado dos mortos; seu sentido varia conforme a passagem.","refs":"Lucas 16:23; Atos 2:27–31; Apocalipse 20:13–14"},
{"term":"Hebreu","definition":"Designação antiga associada aos antepassados e ao povo de Israel; também aparece como identificação étnica ou linguística.","refs":"Gênesis 14:13; Êxodo 2:6; Filipenses 3:5"},
{"term":"Herança","definition":"Bem recebido por sucessão; na Bíblia, também é imagem da promessa e da vida concedida por Deus.","refs":"Números 26:52–56; Efésios 1:11–14; Colossenses 3:24"},
{"term":"Herodes","definition":"Nome de uma dinastia de governantes da Judeia e regiões vizinhas no período do Novo Testamento.","refs":"Mateus 2:1–18; Lucas 23:7–12; Atos 12:1–23"},
{"term":"Hermon","definition":"Montanha ao norte de Israel, conhecida por sua altitude e por sua neve.","refs":"Deuteronômio 3:8–9; Salmos 133:3; Mateus 17:1"},
{"term":"Hosana","definition":"Aclamação de louvor que originalmente expressava um pedido de salvação e passou a ser usada em celebrações.","refs":"Salmos 118:25–26; Mateus 21:9; João 12:13"},
{"term":"Hospitalidade","definition":"Acolhimento e cuidado oferecidos a visitantes e pessoas necessitadas; prática recomendada nas Escrituras.","refs":"Gênesis 18:1–8; Romanos 12:13; Hebreus 13:2"},
{"term":"Humildade","definition":"Postura de modéstia e serviço, sem buscar superioridade; Jesus é apresentado como exemplo de humildade.","refs":"Provérbios 22:4; Mateus 11:29; Filipenses 2:3–8"},
{"term":"Idolatria","definition":"Adoração ou confiança dada a ídolos ou a algo que toma o lugar de Deus.","refs":"Êxodo 20:3–6; 1 Coríntios 10:14; 1 João 5:21"},
{"term":"Imagem de Deus","definition":"Expressão de Gênesis para descrever a dignidade e a vocação humanas na criação.","refs":"Gênesis 1:26–27; 9:6; Colossenses 3:10"},
{"term":"Imposição de mãos","definition":"Ato simbólico usado em diferentes passagens para bênção, designação ou oração por alguém.","refs":"Números 27:18–23; Atos 6:6; 1 Timóteo 4:14"},
{"term":"Incenso","definition":"Mistura aromática queimada em ritos de culto; em algumas passagens, simboliza as orações.","refs":"Êxodo 30:1–10; Salmos 141:2; Apocalipse 8:3–4"},
{"term":"Iniquidade","definition":"Termo bíblico para injustiça ou perversidade, frequentemente associado à culpa e ao afastamento de Deus.","refs":"Salmos 51:2–5; Isaías 53:5–6; Mateus 7:23"},
{"term":"Intercessão","definition":"Oração feita em favor de outra pessoa ou grupo.","refs":"Gênesis 18:22–33; Lucas 22:31–32; Hebreus 7:25"},
{"term":"Ira de Deus","definition":"Expressão bíblica para a oposição de Deus ao mal e à injustiça; os textos também falam de misericórdia e paciência.","refs":"Romanos 1:18; 2:5–8; Efésios 4:26"},
{"term":"Isaac","definition":"Filho de Abraão e Sara, herdeiro da promessa e pai de Jacó e Esaú.","refs":"Gênesis 21:1–7; 22:1–19; Hebreus 11:17–19"},
{"term":"Israel","definition":"Nome dado a Jacó e, depois, ao povo e à terra associados a seus descendentes.","refs":"Gênesis 32:28; Êxodo 4:22; Romanos 9:4"},
{"term":"Jacó","definition":"Patriarca, filho de Isaque e pai dos doze filhos associados às tribos de Israel; também recebeu o nome Israel.","refs":"Gênesis 25:26; 28:10–22; 32:24–29"},
{"term":"Javé","definition":"Forma portuguesa de representar o nome divino YHWH, cuja pronúncia antiga não é conhecida com certeza. Muitas Bíblias o traduzem como “SENHOR”.","refs":"Êxodo 3:14–15; 6:2–3; Salmos 83:18"},
{"term":"Jerusalém","definition":"Cidade central na história de Israel e cenário da morte e ressurreição de Jesus nos Evangelhos.","refs":"2 Samuel 5:6–10; Salmos 122; Lucas 19:41–44"},
{"term":"Jesus","definition":"Figura central do Novo Testamento, apresentada como Messias e Filho de Deus; seus ensinamentos, morte e ressurreição são o centro da fé cristã.","refs":"Mateus 1:21; João 1:1–14; Atos 4:12"},
{"term":"João Batista","definition":"Profeta que anunciou a chegada do Reino, batizou pessoas no Jordão e batizou Jesus.","refs":"Mateus 3:1–17; Lucas 3:1–20; João 1:19–34"},
{"term":"Jonas","definition":"Profeta enviado a Nínive, cuja história inclui fuga, tempestade e a missão de chamar a cidade ao arrependimento.","refs":"Jonas 1:1–3; 3:1–10; Mateus 12:39–41"},
{"term":"Jubileu","definition":"Ano especial previsto na Lei de Israel, ligado à libertação, ao descanso da terra e à restituição de propriedades.","refs":"Levítico 25:8–17; 25:39–43; Lucas 4:18–19"},
{"term":"Juízo","definition":"Ato de avaliar e fazer justiça. A Bíblia fala de juízos históricos e do juízo final de Deus.","refs":"Salmos 9:7–8; Mateus 25:31–46; Apocalipse 20:11–15"},
{"term":"Justiça","definition":"Retidão e tratamento correto diante de Deus e do próximo; os profetas a relacionam ao cuidado com os vulneráveis.","refs":"Deuteronômio 16:20; Miqueias 6:8; Mateus 23:23"},
{"term":"Kadosh","definition":"Termo hebraico transliterado que significa “santo” ou “separado para Deus”; aparece aqui como apoio de vocabulário original, não como grafia comum nas Bíblias em português.","refs":"Levítico 19:2; Isaías 6:3"},
{"term":"Koinonia","definition":"Palavra grega transliterada para comunhão, participação ou parceria entre pessoas; no Novo Testamento, descreve a vida compartilhada da comunidade cristã.","refs":"Atos 2:42; Filipenses 2:1; 1 João 1:3"},
{"term":"Kyrios","definition":"Palavra grega transliterada geralmente traduzida por “Senhor”. Pode designar autoridade humana e, em muitos textos, Jesus.","refs":"Romanos 10:9; 1 Coríntios 12:3; Filipenses 2:11"},
{"term":"Lázaro","definition":"Nome de duas figuras do Novo Testamento, incluindo o irmão de Marta e Maria que Jesus chamou de volta à vida.","refs":"Lucas 16:19–31; João 11:1–44; 12:1–3"},
{"term":"Lei","definition":"Pode designar a instrução de Deus, especialmente os mandamentos dados a Israel, ou os cinco primeiros livros da Bíblia, conforme o contexto.","refs":"Êxodo 20:1–17; Salmos 19:7–11; Mateus 5:17"},
{"term":"Leproso","definition":"Termo bíblico tradicional para pessoas com doenças de pele que podiam exigir isolamento ritual; não corresponde necessariamente ao diagnóstico moderno de hanseníase.","refs":"Levítico 13:1–8; Marcos 1:40–45; Lucas 17:11–19"},
{"term":"Levi","definition":"Filho de Jacó e antepassado da tribo que recebeu funções de serviço religioso em Israel.","refs":"Gênesis 29:34; Êxodo 6:16; Números 3:5–10"},
{"term":"Levita","definition":"Membro da tribo de Levi, separada para tarefas relacionadas ao santuário e ao culto de Israel.","refs":"Números 3:5–10; Deuteronômio 10:8; Lucas 10:32"},
{"term":"Lídia","definition":"Vendedora de púrpura de Filipos que acolheu a mensagem de Paulo e hospedou os missionários.","refs":"Atos 16:11–15, 40"},
{"term":"Louvor","definition":"Expressão de reconhecimento e gratidão a Deus, em palavras, cânticos ou ações.","refs":"Salmos 150; Lucas 19:37–40; Hebreus 13:15"},
{"term":"Luz","definition":"Imagem literal e simbólica ligada à criação, à orientação e à vida; Jesus se apresenta como luz do mundo.","refs":"Gênesis 1:3–5; João 8:12; Efésios 5:8–14"},
{"term":"Maranata","definition":"Expressão aramaica preservada por Paulo, geralmente entendida como uma oração ou declaração sobre a vinda do Senhor.","refs":"1 Coríntios 16:22"},
{"term":"Maná","definition":"Alimento que, segundo Êxodo, Deus forneceu aos israelitas durante a caminhada pelo deserto.","refs":"Êxodo 16:13–36; Números 11:7–9; João 6:31–35"},
{"term":"Mandamento","definition":"Ordem ou instrução de Deus. A Bíblia reúne mandamentos sobre culto, justiça e relações com o próximo.","refs":"Êxodo 20:1–17; Deuteronômio 6:4–9; João 13:34"},
{"term":"Mediador","definition":"Pessoa que atua entre partes. O Novo Testamento chama Jesus de mediador entre Deus e a humanidade.","refs":"1 Timóteo 2:5; Hebreus 8:6; 9:15"},
{"term":"Melquisedeque","definition":"Rei de Salém e sacerdote do Deus Altíssimo que abençoou Abraão; Hebreus usa sua figura ao falar do sacerdócio de Cristo.","refs":"Gênesis 14:18–20; Salmos 110:4; Hebreus 7:1–17"},
{"term":"Milagre","definition":"Acontecimento extraordinário apresentado nos textos bíblicos como sinal da ação ou do poder de Deus.","refs":"Êxodo 14:21–31; João 2:1–11; Atos 3:1–10"},
{"term":"Moisés","definition":"Líder chamado por Deus para conduzir os israelitas para fora do Egito e transmitir a Lei.","refs":"Êxodo 3:1–12; 14:21–31; Deuteronômio 34:1–12"},
{"term":"Monoteísmo","definition":"Termo usado para descrever a crença em um só Deus, afirmada em textos centrais da Bíblia.","refs":"Deuteronômio 6:4; Isaías 45:5–6; Marcos 12:29"},
{"term":"Morte","definition":"Fim da vida física, tratada na Bíblia como realidade humana e, em várias passagens, como inimiga que Deus promete vencer.","refs":"Gênesis 3:19; Romanos 6:23; 1 Coríntios 15:26"},
{"term":"Naamã","definition":"Comandante sírio que, segundo 2 Reis, foi curado de uma doença de pele após procurar o profeta Eliseu.","refs":"2 Reis 5:1–19; Lucas 4:27"},
{"term":"Nação","definition":"Povo ou comunidade política. A Bíblia aborda a relação de Israel com outras nações e anuncia bênção para todos os povos.","refs":"Gênesis 12:2–3; Salmos 67:1–4; Mateus 28:19"},
{"term":"Nascimento de Jesus","definition":"Relatos dos Evangelhos sobre o nascimento de Jesus, incluindo as narrativas de Mateus e Lucas.","refs":"Mateus 1:18–25; 2:1–12; Lucas 1:26–38; 2:1–20"},
{"term":"Nazaré","definition":"Cidade da Galileia onde Jesus cresceu e de onde era conhecido.","refs":"Mateus 2:19–23; Lucas 4:16–30; João 1:45–46"},
{"term":"Nazireu","definition":"Pessoa consagrada por um voto especial descrito em Números, com regras sobre cabelo, vinho e contato com mortos.","refs":"Números 6:1–21; Juízes 13:5; 1 Samuel 1:11"},
{"term":"Nicodemos","definition":"Fariseu e membro do conselho judaico que conversou com Jesus e participou de seu sepultamento.","refs":"João 3:1–21; 7:50–52; 19:38–42"},
{"term":"Nínive","definition":"Grande cidade assíria à qual Jonas foi enviado; também é cenário de profecias contra a Assíria.","refs":"Jonas 3:1–10; Naum 1:1; Lucas 11:30"},
{"term":"Noé","definition":"Homem descrito em Gênesis como justo em sua geração e preservado com sua família durante o dilúvio.","refs":"Gênesis 6:9–22; 7:1–24; Hebreus 11:7"},
{"term":"Nova aliança","definition":"Aliança anunciada pelos profetas e associada por Jesus à sua morte; Hebreus a relaciona à promessa de perdão e renovação.","refs":"Jeremias 31:31–34; Lucas 22:20; Hebreus 8:6–13"},
{"term":"Novo nascimento","definition":"Imagem usada por Jesus para falar da necessidade de nascer do Espírito e iniciar uma vida renovada.","refs":"João 3:3–8; 1 Pedro 1:3, 23; Tito 3:5"},
{"term":"Obediência","definition":"Ato de escutar e cumprir uma orientação. A Bíblia relaciona obediência à confiança e ao amor a Deus.","refs":"Deuteronômio 6:4–9; João 14:15; Romanos 6:16"},
{"term":"Óleo da unção","definition":"Óleo usado em ritos de consagração e, em outros contextos, em práticas de cuidado e oração.","refs":"Êxodo 30:22–33; 1 Samuel 16:13; Tiago 5:14"},
{"term":"Oliveiras, Monte das","definition":"Elevação a leste de Jerusalém associada ao ensino, à oração e à prisão de Jesus.","refs":"Mateus 24:3; Lucas 22:39–46; Atos 1:9–12"},
{"term":"Onipotência","definition":"Termo teológico para expressar o poder de Deus; as passagens bíblicas afirmam que nada é impossível para ele.","refs":"Jó 42:2; Lucas 1:37; Apocalipse 19:6"},
{"term":"Onisciência","definition":"Termo teológico para o conhecimento pleno de Deus, inclusive dos pensamentos e caminhos humanos.","refs":"Salmos 139:1–6; Hebreus 4:13; 1 João 3:20"},
{"term":"Onipresença","definition":"Termo teológico para a presença de Deus em todo lugar, sem que alguém possa se esconder dele.","refs":"Salmos 139:7–12; Jeremias 23:23–24"},
{"term":"Oração","definition":"Fala ou relação com Deus que pode incluir louvor, pedido, confissão, agradecimento e intercessão.","refs":"Mateus 6:5–13; Filipenses 4:6–7; 1 Tessalonicenses 5:17"},
{"term":"Oráculo","definition":"Mensagem ou declaração recebida de Deus; em algumas traduções, a palavra também se refere aos pronunciamentos sagrados confiados a Israel.","refs":"1 Samuel 3:1; Romanos 3:2; 1 Pedro 4:11"},
{"term":"Oferta","definition":"Dádiva apresentada a Deus ou destinada ao serviço religioso e ao cuidado de outras pessoas.","refs":"Levítico 1:1–9; Marcos 12:41–44; Filipenses 4:18"},
{"term":"Páscoa","definition":"Festa que recorda a libertação de Israel do Egito; os Evangelhos situam a morte de Jesus nesse período.","refs":"Êxodo 12:1–14; Lucas 22:7–20; 1 Coríntios 5:7"},
{"term":"Paz","definition":"Bem-estar, reconciliação e vida íntegra; no Novo Testamento, também descreve a paz com Deus e entre pessoas.","refs":"Números 6:24–26; João 14:27; Filipenses 4:7"},
{"term":"Perdão","definition":"Ato de cancelar a culpa ou a dívida e restaurar a relação; a Bíblia apresenta Deus como aquele que perdoa.","refs":"Salmos 32:1–5; Mateus 6:12; Efésios 1:7"},
{"term":"Presbítero","definition":"Líder ou ancião da comunidade cristã, com responsabilidades de cuidado e ensino.","refs":"Atos 14:23; Tito 1:5–9; 1 Timóteo 5:17"},
{"term":"Primícias","definition":"Primeira parte da colheita, oferecida a Deus; no Novo Testamento, também é imagem de começo e garantia.","refs":"Êxodo 23:19; Levítico 23:9–14; 1 Coríntios 15:20–23"},
{"term":"Príncipe da Paz","definition":"Título poético do governante anunciado em Isaías e associado na tradição cristã a Jesus.","refs":"Isaías 9:6–7; João 14:27; Efésios 2:14"},
{"term":"Pródigo","definition":"Que gasta de modo extravagante. O termo é conhecido pela parábola do filho que abandona a casa e depois retorna.","refs":"Lucas 15:11–32"},
{"term":"Profecia","definition":"Mensagem atribuída à ação de Deus, que pode advertir, consolar, orientar ou anunciar acontecimentos.","refs":"Deuteronômio 18:18–22; 1 Coríntios 14:1–5; 2 Pedro 1:20–21"},
{"term":"Propiciação","definition":"Termo teológico usado para falar do tratamento da culpa e da reconciliação por meio de Cristo; traduções bíblicas também usam termos como sacrifício ou expiação.","refs":"Romanos 3:25; 1 João 2:2; 4:10"},
{"term":"Queda","definition":"Nome dado à desobediência humana narrada em Gênesis 3 e às suas consequências; Paulo a relaciona à entrada do pecado e da morte.","refs":"Gênesis 3:1–24; Romanos 5:12–19; 1 Coríntios 15:21–22"},
{"term":"Querubim","definition":"Ser celestial associado à guarda da santidade de Deus e à decoração do santuário.","refs":"Gênesis 3:24; Êxodo 25:18–22; Ezequiel 10:1–22"},
{"term":"Quiriate-Arba","definition":"Nome antigo de Hebrom, cidade associada aos patriarcas e à herança de Calebe.","refs":"Gênesis 23:2; Josué 14:15; 15:13"},
{"term":"Quiriate-Jearim","definition":"Cidade de Judá onde a arca da aliança permaneceu antes de ser levada a Jerusalém.","refs":"Josué 9:17; 1 Samuel 7:1–2; 2 Samuel 6:2"},
{"term":"Quirino","definition":"Governador romano da Síria mencionado por Lucas ao situar o recenseamento ligado ao nascimento de Jesus.","refs":"Lucas 2:1–2"},
{"term":"Rabi","definition":"Título de respeito para um mestre ou instrutor judaico; os Evangelhos o aplicam a Jesus.","refs":"Mateus 23:7–8; João 1:38; 20:16"},
{"term":"Reconciliação","definition":"Restauração de uma relação rompida. Paulo descreve Deus reconciliando consigo as pessoas por meio de Cristo.","refs":"Romanos 5:10–11; 2 Coríntios 5:18–21; Colossenses 1:20–22"},
{"term":"Redentor","definition":"Aquele que liberta ou resgata. A Bíblia aplica essa imagem a Deus e, no Novo Testamento, à obra de Cristo.","refs":"Jó 19:25; Isaías 59:20; Gálatas 3:13"},
{"term":"Regeneração","definition":"Termo teológico para a renovação da vida atribuída à ação de Deus.","refs":"Mateus 19:28; João 3:3–8; Tito 3:5"},
{"term":"Remanescente","definition":"Grupo que permanece após uma crise ou juízo e é associado à continuidade das promessas de Deus.","refs":"1 Reis 19:18; Isaías 10:20–22; Romanos 11:5"},
{"term":"Remissão","definition":"Cancelamento ou perdão de uma dívida ou culpa; em textos cristãos, refere-se ao perdão dos pecados.","refs":"Mateus 26:28; Atos 2:38; Hebreus 9:22"},
{"term":"Repouso","definition":"Descanso físico ou espiritual. Hebreus usa o descanso prometido a Israel como imagem de confiança em Deus.","refs":"Gênesis 2:2–3; Salmos 95:7–11; Hebreus 4:9–11"},
{"term":"Revelação","definition":"Ato de tornar conhecido algo antes oculto. O Novo Testamento usa o termo para a mensagem de Deus e para a manifestação futura de Cristo.","refs":"Daniel 2:22; Gálatas 1:11–12; Apocalipse 1:1"},
{"term":"Rocha","definition":"Imagem de firmeza e proteção, aplicada a Deus em salmos e a Cristo em textos do Novo Testamento.","refs":"Salmos 18:2; Mateus 16:18; 1 Coríntios 10:4"},
{"term":"Rute","definition":"Mulher moabita cuja lealdade a Noemi e integração em Israel são narradas no livro que leva seu nome.","refs":"Rute 1:16–17; 2:8–12; 4:13–17"},
{"term":"Sacrifício","definition":"Oferta ritual ou ato de entrega. Os textos bíblicos falam de sacrifícios no culto de Israel e usam essa linguagem para descrever a morte de Cristo.","refs":"Levítico 1:1–9; Isaías 53:5–10; Hebreus 10:1–14"},
{"term":"Samaritano","definition":"Pessoa pertencente à comunidade da Samaria. Os Evangelhos destacam encontros e parábolas que atravessam a divisão entre judeus e samaritanos.","refs":"2 Reis 17:24–41; Lucas 10:30–37; João 4:4–26"},
{"term":"Santuário","definition":"Lugar separado para culto e encontro com Deus; pode referir-se ao tabernáculo, ao templo ou ao santuário celestial.","refs":"Êxodo 25:8–9; Hebreus 9:1–12; Apocalipse 15:5"},
{"term":"Satanás","definition":"Adversário ou acusador; aparece em narrativas e visões como opositor de Deus e de seu povo.","refs":"Jó 1:6–12; Lucas 10:18; Apocalipse 12:9"},
{"term":"Selo","definition":"Marca usada para autenticar, proteger ou identificar algo. Paulo usa a imagem para falar do Espírito Santo como garantia.","refs":"Ester 8:8; Efésios 1:13–14; Apocalipse 7:2–4"},
{"term":"Semente","definition":"Grão usado na agricultura e imagem de descendência, promessa e crescimento nas parábolas.","refs":"Gênesis 3:15; Mateus 13:3–9; Gálatas 3:16"},
{"term":"Seol","definition":"Palavra hebraica associada ao domínio dos mortos; o sentido varia entre os textos e não corresponde sempre a uma descrição detalhada do além.","refs":"Gênesis 37:35; Salmos 16:10; Eclesiastes 9:10"},
{"term":"Servo","definition":"Pessoa que serve a outra. A expressão “servo do Senhor” descreve líderes e profetas; Isaías também fala do servo sofredor.","refs":"Isaías 52:13–53:12; Marcos 10:45; Atos 3:13"},
{"term":"Soberania","definition":"Termo teológico para a autoridade e o governo de Deus sobre a criação e a história.","refs":"Salmos 103:19; Daniel 4:34–35; Efésios 1:11"},
{"term":"Sofrimento","definition":"Experiência de dor e aflição. A Bíblia registra o sofrimento de pessoas fiéis e apresenta Jesus como aquele que sofreu.","refs":"Isaías 53:3–5; Romanos 8:17–18; 1 Pedro 4:13"},
{"term":"Tabernáculo","definition":"Tenda sagrada usada por Israel no deserto como lugar de culto e símbolo da presença de Deus.","refs":"Êxodo 25:8–9; 40:34–38; Hebreus 9:1–12"},
{"term":"Talento","definition":"Grande unidade de peso e valor monetário no mundo antigo; aparece em parábolas de Jesus sobre responsabilidade.","refs":"Mateus 18:23–35; 25:14–30"},
{"term":"Tártaro","definition":"Termo grego usado uma vez no Novo Testamento para descrever a prisão de anjos que pecaram.","refs":"2 Pedro 2:4"},
{"term":"Templo","definition":"Edifício central do culto em Jerusalém. O Novo Testamento também chama a comunidade ou o corpo de santuário em sentido figurado.","refs":"1 Reis 6:1–14; Marcos 13:1–2; 1 Coríntios 3:16"},
{"term":"Tentação","definition":"Provação ou convite ao mal. A Bíblia distingue a provação da tentação para praticar o pecado.","refs":"Mateus 4:1–11; 1 Coríntios 10:13; Tiago 1:13–15"},
{"term":"Teofania","definition":"Termo teológico para uma manifestação perceptível de Deus em uma narrativa bíblica.","refs":"Êxodo 3:1–6; 19:16–20; Atos 7:30–35"},
{"term":"Tetragrama","definition":"Nome de quatro letras hebraicas YHWH, usado na Bíblia hebraica para o nome de Deus e geralmente traduzido como “SENHOR”.","refs":"Êxodo 3:15; Salmos 83:18; Isaías 42:8"},
{"term":"Transfiguração","definition":"Episódio em que Jesus aparece em glória diante de alguns discípulos, acompanhado por Moisés e Elias.","refs":"Mateus 17:1–8; Marcos 9:2–8; 2 Pedro 1:16–18"},
{"term":"Tribulação","definition":"Aflição ou perseguição. Jesus alerta seus discípulos sobre dificuldades e também lhes promete esperança.","refs":"Mateus 24:21–22; João 16:33; Apocalipse 7:14"},
{"term":"Trombeta","definition":"Instrumento usado para convocação, festas, guerra e sinais; aparece também em imagens proféticas.","refs":"Números 10:1–10; 1 Coríntios 15:52; Apocalipse 8:6"},
{"term":"Torre de Babel","definition":"Construção da narrativa de Gênesis associada ao orgulho humano e à dispersão das línguas.","refs":"Gênesis 11:1–9"},
{"term":"Trigo","definition":"Cereal básico nas sociedades bíblicas; Jesus o usa em parábolas sobre crescimento, colheita e juízo.","refs":"Deuteronômio 8:7–8; Mateus 13:24–30; João 12:24"},
{"term":"Unidade","definition":"Condição de comunhão e paz entre pessoas; no Novo Testamento, é um chamado para a comunidade cristã.","refs":"Salmos 133:1; João 17:20–23; Efésios 4:1–6"},
{"term":"Ungido","definition":"Pessoa marcada com óleo para uma função especial. O título “Messias” ou “Cristo” significa “Ungido”.","refs":"1 Samuel 16:13; Salmos 2:2; Lucas 4:18"},
{"term":"Ur","definition":"Cidade mesopotâmica associada à origem de Abraão e de sua família.","refs":"Gênesis 11:28–31; 15:7; Neemias 9:7"},
{"term":"Urim e Tumim","definition":"Objetos associados ao peitoral do sumo sacerdote e usados em consultas religiosas no antigo Israel; seu funcionamento exato é desconhecido.","refs":"Êxodo 28:30; Levítico 8:8; Esdras 2:63"},
{"term":"Usura","definition":"Cobrança de juros abusivos ou exploração financeira, condenada em leis e textos de sabedoria.","refs":"Êxodo 22:25; Deuteronômio 23:19–20; Salmos 15:5"},
{"term":"Uz","definition":"Região associada à terra de Jó e mencionada em outras listas e profecias.","refs":"Gênesis 10:23; Jó 1:1; Lamentações 4:21"},
{"term":"Uzias","definition":"Rei de Judá cujo reinado é descrito em 2 Crônicas; Isaías situa uma visão no ano de sua morte.","refs":"2 Reis 15:1–7; 2 Crônicas 26:1–23; Isaías 6:1"},
{"term":"Vasti","definition":"Rainha persa que, segundo Ester, foi deposta após recusar o pedido do rei.","refs":"Ester 1:9–22"},
{"term":"Véu","definition":"Tecido ou cobertura usado para separar espaços sagrados ou cobrir o rosto; no Novo Testamento, também aparece em imagens de acesso e compreensão.","refs":"Êxodo 26:31–33; Mateus 27:51; Hebreus 10:19–20"},
{"term":"Verdade","definition":"Aquilo que é verdadeiro e fiel. O Evangelho de João associa a verdade à revelação de Deus em Jesus.","refs":"Salmos 119:160; João 14:6; 17:17"},
{"term":"Verbo","definition":"Título de Jesus no prólogo do Evangelho de João, que o apresenta como aquele que estava com Deus e se fez carne.","refs":"João 1:1–14; 1 João 1:1–3; Apocalipse 19:13"},
{"term":"Vida eterna","definition":"Vida associada à comunhão com Deus e à esperança futura, apresentada como dádiva por meio de Jesus.","refs":"João 3:16; 17:3; 1 João 5:11–13"},
{"term":"Videira","definition":"Planta comum nas imagens bíblicas de Israel; Jesus se descreve como a videira verdadeira e seus discípulos como ramos.","refs":"Salmos 80:8–16; Isaías 5:1–7; João 15:1–8"},
{"term":"Vinho","definition":"Bebida de uva presente em refeições e celebrações bíblicas; seu uso e significado variam conforme a passagem.","refs":"Salmos 104:14–15; João 2:1–11; 1 Timóteo 5:23"},
{"term":"Visão","definition":"Experiência em que alguém recebe uma mensagem ou imagem reveladora, especialmente em narrativas proféticas.","refs":"Gênesis 15:1; Daniel 7:1; Atos 10:9–16"},
{"term":"Virtude","definition":"Qualidade moral ou excelência. As cartas cristãs relacionam virtudes ao crescimento na fé e à prática do bem.","refs":"Filipenses 4:8; 2 Pedro 1:3–8"},
{"term":"Voto","definition":"Promessa solene feita a Deus. A Lei orienta que votos sejam tratados com seriedade.","refs":"Gênesis 28:20–22; Números 30:2; Eclesiastes 5:4–5"},
{"term":"Vitória","definition":"Triunfo sobre um adversário ou dificuldade. Paulo usa a imagem para falar da esperança cristã diante da morte.","refs":"1 Coríntios 15:54–57; 1 João 5:4–5"},
{"term":"Yahweh","definition":"Forma acadêmica comum de representar a pronúncia do nome YHWH. A pronúncia antiga não é certa; muitas traduções usam “SENHOR”.","refs":"Êxodo 3:15; 6:2–3; Salmos 83:18"},
{"term":"YHWH","definition":"Quatro consoantes hebraicas que formam o nome próprio de Deus na Bíblia hebraica, normalmente traduzido por “SENHOR” em português.","refs":"Êxodo 3:15; Salmos 83:18; Isaías 42:8"},
{"term":"Xerxes","definition":"Nome grego de um rei persa que muitos estudiosos identificam com Assuero, personagem do livro de Ester; a identificação histórica é tradicional, não uma grafia usada pela ARA ou ARC.","refs":"Ester 1:1; 2:16; 10:1"},
{"term":"Zacarias","definition":"Nome de vários personagens bíblicos, entre eles um profeta do período pós-exílico e o pai de João Batista.","refs":"Zacarias 1:1; Lucas 1:5–23; Mateus 23:35"},
{"term":"Zaqueu","definition":"Chefe dos publicanos em Jericó que recebeu Jesus em sua casa e prometeu reparar injustiças.","refs":"Lucas 19:1–10"},
{"term":"Zebedeu","definition":"Pai dos apóstolos Tiago e João, pescador da Galileia.","refs":"Mateus 4:21–22; 10:2; Marcos 1:19–20"},
{"term":"Zedequias","definition":"Último rei de Judá antes da destruição de Jerusalém pelos babilônios.","refs":"2 Reis 24:17–20; 25:1–7; Jeremias 39:1–7"},
{"term":"Zelote","definition":"Designação de Simão entre os apóstolos; o termo também está ligado a movimentos judaicos de zelo político e religioso.","refs":"Lucas 6:15; Atos 1:13; 5:37"},
{"term":"Zerá","definition":"Nome de diferentes personagens bíblicos, incluindo um filho de Judá e um líder etíope que enfrentou Asa.","refs":"Gênesis 38:27–30; Josué 7:1; 2 Crônicas 14:9–15"},
{"term":"Zorobabel","definition":"Líder de Judá no período do retorno do exílio babilônico, associado à reconstrução do templo.","refs":"Esdras 2:2; Ageu 1:1–14; Mateus 1:12"}
].sort((a,b)=>a.term.normalize("NFD").replace(/[\u0300-\u036f]/g,"").localeCompare(b.term.normalize("NFD").replace(/[\u0300-\u036f]/g,""),"pt-BR"))
function prpPlanData(){try{const data=JSON.parse(localStorage.getItem(PRP_PLAN_STORAGE_KEY)||"null");if(data&&typeof data==="object")return{startDate:/^\d{4}-\d{2}-\d{2}$/.test(data.startDate||"")?data.startDate:today(),completed:data.completed&&typeof data.completed==="object"?data.completed:{}}}catch(e){}return{startDate:today(),completed:{}}}
function prpSavePlan(data){try{localStorage.setItem(PRP_PLAN_STORAGE_KEY,JSON.stringify(data))}catch(e){toast("Não consegui salvar o progresso neste aparelho.",1)}}
function prpPlanCurrentDay(startDate){const start=Date.parse(String(startDate||today())+"T00:00:00Z"),now=Date.parse(today()+"T00:00:00Z");if(!Number.isFinite(start)||!Number.isFinite(now))return 1;return Math.min(365,Math.max(1,Math.floor((now-start)/86400000)+1))}
function prpPlanGroups(day){const chapters=[];BK.forEach((book,index)=>{for(let chapter=1;chapter<=book[2];chapter++)chapters.push({bookId:index+1,book:book[1],chapter})});const first=Math.floor((day-1)*chapters.length/365),last=Math.floor(day*chapters.length/365),selected=chapters.slice(first,last),groups=[];selected.forEach(item=>{const prior=groups[groups.length-1];if(prior&&prior.bookId===item.bookId&&prior.end+1===item.chapter)prior.end=item.chapter;else groups.push({bookId:item.bookId,book:item.book,start:item.chapter,end:item.chapter})});return groups}
function prpSetPlanStart(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value||""))return;const data=prpPlanData();data.startDate=value;prpSavePlan(data);R.planDay=prpPlanCurrentDay(value);render()}
function prpMovePlanDay(delta){const data=prpPlanData(),current=Math.max(1,Math.min(365,Number(R.planDay)||prpPlanCurrentDay(data.startDate)));R.planDay=Math.max(1,Math.min(365,current+delta));render()}
function prpTogglePlanDay(day){const data=prpPlanData(),key=String(day);data.completed[key]=!data.completed[key];prpSavePlan(data);render()}
function prpOpenPlanBible(bookId,chapter){R.bibleBook=bookId;R.bibleChapter=chapter;go("bible")}
function prpReadingPlanPage(){const data=prpPlanData(),todayDay=prpPlanCurrentDay(data.startDate),day=Math.max(1,Math.min(365,Number(R.planDay)||todayDay)),groups=prpPlanGroups(day),completed=!!data.completed[String(day)],done=Object.keys(data.completed).filter(key=>data.completed[key]).length,pct=Math.round(done/365*100);R.planDay=day;return'<div class="l" style="max-width:900px;margin:0 auto"><div class="card"><span class="chip">PLANO DE 365 DIAS</span><h2 style="margin-top:12px">Leia a Bíblia toda em um ano</h2><p class="mu">Plano contínuo, de Gênesis a Apocalipse, com 3 ou 4 capítulos por dia. O progresso fica salvo neste aparelho.</p><label for="readingPlanStart">Data de início</label><input id="readingPlanStart" type="date" value="'+esc(data.startDate)+'" onchange="prpSetPlanStart(this.value)"><div style="margin-top:16px"><div class="r wrap"><strong>Progresso: '+done+' de 365 dias</strong><span class="mu sm">'+pct+'%</span></div><div class="bar"><i style="width:'+pct+'%"></i></div></div></div><div class="card"><div class="r wrap"><button class="btn" type="button" onclick="prpMovePlanDay(-1)"'+(day<=1?' disabled':'')+'>‹ Dia anterior</button><strong>Dia '+day+' de 365</strong><button class="btn" type="button" onclick="prpMovePlanDay(1)"'+(day>=365?' disabled':'')+'>Próximo dia ›</button></div><h3 style="margin-top:20px">Leitura do dia</h3><div class="l" style="margin-top:10px">'+groups.map(item=>'<div class="r wrap"><span><b>'+esc(item.book)+' '+item.start+(item.end!==item.start?'–'+item.end:'')+'</b></span><button class="btn" type="button" onclick="prpOpenPlanBible('+item.bookId+','+item.start+')">Abrir na Bíblia</button></div>').join('')+'</div><button class="btn '+(completed?'':'p')+'" style="margin-top:18px" type="button" onclick="prpTogglePlanDay('+day+')">'+(completed?'Desmarcar leitura concluída':'Marcar dia como lido')+'</button><p class="mu sm" style="margin-bottom:0">Hoje corresponde ao dia '+todayDay+' do plano. Você pode consultar outros dias pelos botões acima.</p></div></div>'}

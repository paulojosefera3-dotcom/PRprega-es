  localBibleStory("pearl-great-value","A Pérola de Grande Valor","Mateus 13:45–46",["perola de grande valor","pérola de grande valor","pérola preciosa","negociante de pérolas"],"Um negociante que procura boas pérolas encontra uma de grande valor e vende tudo para adquiri-la.","A parábola ressalta a preciosidade do Reino e a decisão total de quem o encontra.","Mateus 13:45–46 forma par com o tesouro escondido, mas apresenta um buscador experiente e intencional.",[["O negociante procura com atenção","Ele está em busca de pérolas de qualidade.","Cultive discernimento e busca sincera, sem confundir convicção com certeza arrogante."],["O encontro revela um valor excepcional","A pérola encontrada supera as demais.","Pergunte quais valores do Reino merecem prioridade em sua vida."],["A resposta é deliberada","O negociante decide vender seus bens para adquirir a pérola.","Transforme a convicção em passos práticos, responsáveis e proporcionais."]]),
  localBibleStory("net","A Rede","Mateus 13:47–50",["parabola da rede","rede lançada ao mar","pesca e rede"],"Uma rede lançada ao mar recolhe peixes de toda espécie; na praia, os pescadores separam os bons dos que não servem.","A explicação de Jesus relaciona a separação ao juízo no fim dos tempos.","Mateus 13:47–50 encerra a série de parábolas do Reino com uma advertência sobre o juízo.",[["A rede recolhe sem distinção inicial","A imagem começa com peixes de toda espécie na rede.","Não reivindique conhecer de antemão o destino final de cada pessoa."],["A separação acontece depois","Os pescadores fazem a seleção na praia.","Pratique discernimento ético sem transformar a comunidade em tribunal de condenação."],["O texto chama à seriedade diante de Deus","Mateus 13:49–50 interpreta a separação como juízo.","Leia a advertência junto com os demais ensinos de Jesus sobre misericórdia e responsabilidade."]]),
  localBibleStory("two-sons","Os Dois Filhos","Mateus 21:28–32",["dois filhos","dois filhos na vinha","filho que disse nao e foi","filho que disse sim e nao foi"],"Um pai pede aos dois filhos que trabalhem na vinha. O primeiro recusa, mas vai; o segundo aceita verbalmente, mas não vai.","Jesus contrasta palavras e ações e confronta líderes que não responderam ao chamado de Deus, enquanto cobradores e prostitutas creram.","Mateus 21:23–32 situa a parábola no debate de autoridade no templo; a comparação não deve ser separada dos versículos 31–32.",[["Palavras não substituem resposta","O segundo filho diz que irá, mas não cumpre.","Avalie compromissos por ações consistentes, sem desvalorizar a importância de reparar promessas quebradas."],["Mudança pode aparecer depois de uma recusa","O primeiro filho muda de atitude e vai trabalhar.","Abra espaço para arrependimento demonstrado em práticas novas."],["Jesus confronta a falsa segurança religiosa","Mateus 21:31–32 aplica a história ao debate com os líderes.","Receba com humildade quem responde a Deus e reavalie barreiras de pertencimento."]]),
  localBibleStory("wicked-tenants","Os Lavradores Maus","Mateus 21:33–46; Marcos 12:1–12; Lucas 20:9–19",["lavradores maus","vinhateiros homicidas","parabola dos lavradores","arrendatarios da vinha"],"O dono de uma vinha envia servos para receber o fruto; os arrendatários os maltratam e matam seu filho.","A parábola denuncia a rejeição dos mensageiros de Deus e, na narrativa, intensifica o conflito de Jesus com as autoridades.","Leia os paralelos e a citação do Salmo 118. A vinha retoma imagens proféticas de Israel, especialmente Isaías 5.",[["A vinha é confiada para produzir fruto","O dono prepara e arrenda a vinha.","Trate autoridade e recursos como responsabilidade, não propriedade sem prestação de contas."],["Os mensageiros são rejeitados","Os servos enviados são agredidos e mortos.","Escute críticas legítimas e proteja quem denuncia abuso de poder."],["O filho rejeitado revela a gravidade do conflito","Os evangelhos ligam a história à rejeição de Jesus e citam o Salmo 118.","Leia a passagem no contexto de Mateus, Marcos ou Lucas e não use a imagem para justificar hostilidade contra judeus."]]),
  localBibleStory("wedding-feast","A Festa de Casamento","Mateus 22:1–14",["festa de casamento","banquete de casamento do rei","convidados da festa de casamento","vestes nupciais"],"Um rei prepara a festa de casamento do filho; convidados recusam o convite, outros são chamados e a narrativa termina com a imagem da veste nupcial.","A parábola trata da resposta ao convite do Reino e da seriedade de participar de modo coerente.","Mateus 22:1–14 é uma parábola própria de Mateus, no debate de Jesus em Jerusalém; Lucas 14:15–24 apresenta outra parábola de banquete.",[["O convite é recusado por alguns","Os convidados desprezam o chamado e alguns maltratam os mensageiros.","Considere o custo de ignorar convites à justiça e à comunhão."],["Outras pessoas são chamadas à festa","A convocação se amplia às encruzilhadas.","Faça da comunidade um lugar de acolhimento real, sem discriminar por status."],["O desfecho cobra coerência","A veste nupcial introduz uma advertência séria no final.","Não reduza a imagem a uma regra de vestuário; leia a advertência no conjunto e pratique uma fé coerente."]]),
  localBibleStory("barren-fig-tree","A Figueira sem Fruto","Lucas 13:6–9",["figueira sem fruto","figueira esteril","figueira estéril","parabola da figueira esteril"],"O dono procura fruto numa figueira sem resultados; o viticultor pede mais tempo para cuidar dela antes de uma nova avaliação.","A parábola une advertência, paciência e oportunidade de mudança no chamado ao arrependimento.","Lucas 13:1–9 reúne uma convocação ao arrependimento e a parábola da figueira; não atribui tragédias à culpa específica das vítimas.",[["A expectativa por fruto é real","O dono procura fruto por três anos e não o encontra.","Examine práticas e resultados com honestidade, sem apontar tragédias como castigo individual."],["O cuidado oferece oportunidade","O viticultor pede tempo para cavar e adubar a árvore.","Acompanhe mudanças com apoio concreto, metas e responsabilidade."],["A paciência não cancela a urgência","O texto mantém a possibilidade de uma decisão futura.","Responda hoje ao chamado para mudar, sem usar a paciência como desculpa para adiar reparação."]]),
  localBibleStory("great-banquet","A Grande Ceia","Lucas 14:15–24",["grande ceia","grande banquete","parabola do grande banquete","convidados dão desculpas"],"Um homem prepara um grande banquete; os convidados apresentam desculpas e o anfitrião chama pessoas pobres, aleijadas, cegas e coxas.","A parábola critica recusas ao convite e destaca a ampliação da mesa para quem costuma ser excluído.","Lucas 14:1–24 situa a história numa refeição e em ensinos sobre humildade e hospitalidade; não confunda com Mateus 22:1–14.",[["Os convidados recusam por motivos próprios","Lucas 14:18–20 relata desculpas relacionadas a negócios e família.","Reflita sobre prioridades que afastam da justiça e da comunhão."],["A mesa se abre a quem foi excluído","Lucas 14:21 destaca pessoas pobres e com deficiência convidadas da cidade.","Pratique acessibilidade, acolhimento e participação, em vez de mera presença simbólica."],["O convite se estende além do círculo inicial","Lucas 14:23 amplia a convocação para os caminhos e cercas.","Amplie relações comunitárias com respeito e sem coerção religiosa."]]),
  localBibleStory("lowest-seat","Os Primeiros Lugares e o Lugar de Honra","Lucas 14:7–11",["primeiros lugares","lugar de honra","assento de honra","convidado humilde"],"Jesus observa convidados escolhendo lugares de honra e aconselha que a pessoa não se promova, mas aceite ser chamada pelo anfitrião.","O ensino critica a busca por status e conclui que quem se exalta será humilhado e quem se humilha será exaltado.","Lucas 14:7–11 é uma parábola breve dentro de uma refeição na casa de um fariseu; o ensino seguinte aborda quem convidar.",[["Observe a disputa por honra","Jesus percebe os convidados escolhendo os lugares principais.","Examine como status e reconhecimento afetam relações e decisões."],["A humildade evita a autopromoção","A pessoa é aconselhada a escolher lugar inferior e receber convite do anfitrião.","Pratique serviço sem usar falsa modéstia como estratégia de prestígio."],["Deus inverte hierarquias","Lucas 14:11 apresenta a conclusão sobre exaltação e humildade.","Construa espaços em que dignidade não dependa de posição social."]]),
  localBibleStory("tower-cost","A Torre Inacabada","Lucas 14:28–30",["torre inacabada","construir uma torre","calcular o custo"],"Jesus pergunta quem começaria a construir uma torre sem primeiro calcular se tem recursos para terminá-la.","A comparação chama a considerar com seriedade o custo do discipulado.","Lucas 14:25–33 reúne o chamado ao discipulado, duas imagens de cálculo e a conclusão sobre renunciar ao que impede segui-lo.",[["Começar exige reflexão","O construtor se assenta para calcular despesas antes da obra.","Planeje compromissos com honestidade e considere recursos e responsabilidades."],["Uma obra inacabada tem consequências públicas","Os observadores podem zombar de quem começou sem concluir.","Evite prometer o que não poderá cumprir; comunique limites com clareza."],["O contexto fala do custo do discipulado","Lucas 14:25–33 relaciona a imagem ao compromisso com Jesus.","Não transforme a metáfora em fórmula de sucesso financeiro ou empresarial."]]),
  localBibleStory("king-war","O Rei que Calcula a Guerra","Lucas 14:31–33",["rei que calcula a guerra","rei contra outro rei","dez mil contra vinte mil"],"Jesus pergunta que rei, diante de um exército maior, não se sentaria primeiro para avaliar suas possibilidades e buscar condições de paz.","A comparação integra o chamado a avaliar o custo de seguir Jesus e agir com lucidez.","Lucas 14:31–33 vem logo após a imagem da torre e antes da conclusão sobre o discipulado.",[["Reconheça os limites da situação","O rei avalia a diferença entre os exércitos.","Considere dados, riscos e consequências antes de uma decisão importante."],["Buscar paz também é uma decisão","O rei envia uma delegação enquanto o outro ainda está longe.","Valorize diálogo e negociação responsável para evitar danos."],["Leia a imagem com seu contexto","Lucas liga a comparação ao custo do discipulado.","Não use o texto como incentivo à guerra; acompanhe a aplicação que o próprio capítulo apresenta."]]),
  localBibleStory("friend-midnight","O Amigo que Pede à Meia-Noite","Lucas 11:5–8",["amigo a meia noite","amigo importuno","amigo que pede pao","pão à meia-noite"],"Um homem procura o amigo à meia-noite para pedir pães para um visitante; a insistência leva o amigo a se levantar e atender.","A história introduz o ensino de Jesus sobre pedir, buscar e bater, encorajando perseverança na oração.","Lucas 11:1–13 começa com o Pai-Nosso e conclui com a imagem de um pai que dá bons presentes aos filhos.",[["A necessidade surge numa situação concreta","O homem recebe um visitante e não tem pão para oferecer.","Apresente necessidades reais a Deus e à comunidade sem vergonha."],["A persistência move a narrativa","O pedido continua apesar do horário inconveniente.","Persevere em oração e também em buscar ajuda concreta."],["Jesus convida a confiar na bondade de Deus","Lucas 11:9–13 amplia a imagem para pedir e receber.","Não conclua que Deus é relutante como o amigo; leia o contraste e o ensino completo."]]),
  localBibleStory("faithful-servant","O Servo Fiel e o Servo Infiel","Mateus 24:45–51; Lucas 12:42–48",["servo fiel e prudente","servo fiel e infiel","mordomo fiel","servo que bate nos outros"],"Um senhor deixa um servo responsável pela casa; o servo fiel alimenta os demais, enquanto outro abusa da demora do senhor e maltrata os companheiros.","A imagem exige fidelidade e responsabilidade durante a espera, com atenção especial a quem recebeu autoridade.","Mateus 24:36–51 e Lucas 12:35–48 falam de vigilância; Lucas destaca graus de responsabilidade conforme o conhecimento recebido.",[["A autoridade é uma tarefa de cuidado","O servo deve distribuir alimento no tempo certo.","Lidere servindo e preste contas do cuidado das pessoas confiadas a você."],["A demora revela o caráter","O servo infiel usa a ausência para abusar dos outros.","Previna abuso com transparência, limites e canais de denúncia."],["Responsabilidade acompanha conhecimento","Lucas 12:47–48 relaciona cobrança ao que cada um recebeu.","Ensine responsabilidade proporcional, sem usar a passagem para ameaçar ou controlar pessoas."]]),
  localBibleStory("watchful-householder","O Dono da Casa e o Ladrão","Mateus 24:42–44; Lucas 12:39–40",["dono da casa e ladrao","ladrão de noite","hora inesperada"],"Jesus compara a vigilância à atitude de um dono que, se soubesse quando viria o ladrão, manteria a casa preparada.","A imagem chama a estar preparado para a vinda do Filho do Homem, sem tentar marcar datas.","Mateus 24 e Lucas 12 apresentam a comparação em discursos sobre vigilância e responsabilidade.",[["O momento não é conhecido","A imagem enfatiza a imprevisibilidade da chegada.","Evite previsões de datas e sensacionalismo sobre o fim."],["Vigiar é viver preparado","A casa é mantida sob cuidado.","Pratique fidelidade no cotidiano, no trabalho e nas relações."],["A expectativa não substitui responsabilidade","O ensino acompanha outras imagens de servos fiéis.","Una esperança futura a cuidado, justiça e serviço no presente."]]),
  localBibleStory("servants-waiting","Os Servos que Esperam o Senhor","Lucas 12:35–40",["servos vigilantes","servos que esperam o senhor","cintura cingida e lampadas acesas"],"Servos aguardam o retorno do senhor de uma festa e são chamados felizes se estiverem vigilantes quando ele chegar.","A parábola associa vigilância à prontidão e ao serviço; a surpreendente imagem do senhor servindo os empregados destaca sua inversão de status.","Lucas 12:35–40 faz parte de uma sequência sobre confiança, bens, vigilância e responsabilidade.",[["A espera é ativa","Os servos mantêm as lâmpadas acesas e aguardam.","Viva a esperança por meio de ações responsáveis no presente."],["O senhor honra os que estão prontos","Lucas 12:37 descreve o senhor servindo os servos vigilantes.","Valorize serviço humilde e cuidado mútuo em posições de liderança."],["A chegada permanece inesperada","Lucas 12:38–40 retoma a necessidade de estar preparado.","Não transforme vigilância em medo; pratique fidelidade cotidiana."]]),
  localBibleStory("unprofitable-servant","O Servo e o Dever Cumprido","Lucas 17:7–10",["servo inutil","servo inútil","dever do servo","servo que fez o que devia"],"Jesus pergunta se um senhor agradeceria imediatamente ao servo que volta do campo e ainda serve a refeição; conclui que os discípulos devem reconhecer o dever cumprido.","A comparação questiona a pretensão de transformar serviço a Deus em crédito que obrigue Deus a recompensar.","Lucas 17:5–10 trata de fé, perdão e serviço; a imagem não autoriza exploração de trabalhadores nem abuso de autoridade.",[["A cena retrata uma relação de serviço","O servo cumpre tarefas no campo e em casa.","Interprete a imagem em seu contexto antigo e não a use para defender exploração atual."],["A fidelidade não compra favores de Deus","O ensino conclui que fizeram o que lhes cabia.","Sirva sem arrogância, mas reconheça limites e direitos de quem trabalha."],["A comparação trata da postura dos discípulos","Lucas 17:5–10 começa com um pedido sobre fé.","Una serviço humilde a relações comunitárias justas e respeitosas."]]),
  localBibleStory("dishonest-manager","O Administrador Infiel","Lucas 16:1–13",["administrador infiel","mordomo infiel","mordomo injusto","parabola do administrador"],"Um administrador acusado de desperdiçar os bens do senhor negocia as dívidas antes de perder o cargo; Jesus comenta a esperteza e ensina sobre fidelidade no uso do dinheiro.","A parábola difícil não elogia fraude como virtude; ela provoca reflexão sobre decisão, recursos e fidelidade a Deus em contraste com as riquezas.","Lucas 16:1–13 deve ser lido até as aplicações finais sobre fidelidade, dinheiro e impossibilidade de servir a dois senhores.",[["A crise expõe a responsabilidade","O administrador precisa prestar contas de sua gestão.","Administre recursos com transparência e aceite prestação de contas."],["O personagem age com urgência e astúcia","Ele busca garantir relações antes de perder o cargo.","Aprenda a agir com diligência sem imitar desonestidade ou manipulação."],["Jesus aplica o ensino à fidelidade","Lucas 16:10–13 fala de dinheiro e de servir a Deus ou às riquezas.","Escolha práticas financeiras honestas e generosas; não use a história para justificar fraude."]]),
  localBibleStory("mina","As Minas","Lucas 19:11–27",["minas","parabola das minas","dez minas","nobre que viaja"],"Um homem nobre viaja para receber um reino e confia uma mina a cada servo. Ao voltar, pede contas do uso dos recursos enquanto enfrenta a oposição de cidadãos.","A parábola fala de responsabilidade durante a espera pelo reino e inclui uma advertência severa sobre rejeição e julgamento.","Lucas 19:11 esclarece que Jesus conta a parábola porque alguns esperavam a manifestação imediata do Reino. Não confunda com os talentos de Mateus 25.",[["A expectativa imediata é corrigida","Lucas diz que a história responde à proximidade esperada do Reino.","Não marque datas; viva com responsabilidade durante a espera."],["Os servos prestam contas do que receberam","Os resultados são diferentes e o rei avalia a administração.","Use capacidades e recursos com diligência sem comparar o valor das pessoas."],["A oposição e o julgamento fazem parte da narrativa","O final inclui cidadãos que rejeitam o nobre e um juízo duro.","Leia o encerramento com seriedade e não transforme a parábola em aprovação de violência política."]]),
  localBibleStory("fig-tree-sign","A Lição da Figueira","Mateus 24:32–35; Marcos 13:28–31; Lucas 21:29–33",["lição da figueira","licao da figueira","figueira e sinais","quando os ramos ficam tenros"],"Jesus usa os ramos novos da figueira para ilustrar que sinais observáveis permitem reconhecer a proximidade de uma estação.","A comparação ensina discernimento e vigilância no discurso escatológico, sem oferecer um calendário para calcular datas.","Leia a imagem no discurso de cada Evangelho, junto das advertências contra engano e da afirmação de que ninguém conhece o dia ou a hora.",[["A natureza ensina a observar sinais","Ramos novos indicam a chegada do verão.","Observe a realidade com atenção e prudência."],["A imagem exige discernimento, não adivinhação","Jesus compara sinais a uma estação reconhecível.","Evite marcar datas para o fim ou espalhar previsões sem base."],["A palavra de Jesus orienta a esperança","O trecho conclui afirmando a permanência de suas palavras.","Viva em vigilância, esperança e responsabilidade comunitária."]]),
  localBibleStory("ten-virgins","As Dez Virgens","Mateus 25:1–13",["dez virgens","dez jovens","virgens prudentes e loucas","noivas e lampadas"],"Dez jovens esperam o noivo; cinco levam óleo extra e cinco não. Como o noivo demora, todas adormecem, mas apenas as preparadas entram na festa.","A parábola conclui com o chamado a vigiar, pois o momento da chegada não é conhecido.","Mateus 25:1–13 integra o discurso de vigilância de Mateus 24–25; todas dormem, e a diferença está na preparação prévia.",[["A demora faz parte da história","O noivo tarda e todas as jovens adormecem.","Não confunda vigilância com ansiedade ou exaustão permanente."],["A preparação não pode ser improvisada no último instante","As prudentes levam óleo extra; as demais ficam sem reserva.","Cultive práticas de fé, aprendizado e cuidado antes das crises."],["A conclusão chama à vigilância","A porta se fecha e o texto conclui que não se sabe o dia nem a hora.","Viva preparado sem medo sensacionalista e sem tentar prever datas."]]),
  localBibleStory("sheep-goats","As Ovelhas e os Bodes","Mateus 25:31–46",["ovelhas e bodes","ovelhas e cabritos","julgamento das nações","quando fizestes a um destes"],"O Filho do Homem separa as nações como um pastor separa ovelhas e bodes, relacionando o tratamento dado aos vulneráveis ao tratamento dado a ele.","A cena enfatiza o cuidado concreto com famintos, estrangeiros, doentes e presos como critério do julgamento. Alguns intérpretes a classificam como parábola; outros, como cena apocalíptica de julgamento.","Mateus 25:31–46 encerra o discurso sobre vigilância com uma visão do julgamento das nações; não reduza os grupos mencionados a uma única interpretação sem explicar a leitura adotada.",[["O julgamento considera a vida concreta","A separação é seguida por exemplos de fome, sede, hospitalidade, roupa, doença e prisão.","Organize cuidado material e visita com dignidade e segurança."],["Jesus se identifica com pessoas vulneráveis","O rei diz que o que foi feito aos menores foi feito a ele.","Escute as pessoas afetadas e inclua-as nas decisões de cuidado."],["A fé é confrontada pela prática","Os dois grupos perguntam quando viram o rei necessitado.","Una confissão de fé a ações consistentes e relações justas."]],"Imagem de julgamento (classificação varia)"),
  localBibleStory("jotham-trees","A Parábola das Árvores de Jotão","Juízes 9:7–15",["arvores de jotao","árvores de jotão","parabola de jotao","oliveira figueira videira espinheiro"],"Jotão conta que as árvores procuram um rei entre oliveira, figueira e videira; todas recusam abandonar seus frutos, e o espinheiro aceita a posição.","A fábula denuncia a ambição de Abimeleque e alerta sobre a escolha de um governante destrutivo.","Juízes 9:1–21 fornece o contexto da disputa pelo poder; a fala de Jotão é uma sátira política em forma de fábula.",[["A fábula responde a um golpe de poder","Jotão fala do monte Gerizim após a coroação de Abimeleque.","Leia a denúncia à luz da violência política narrada no capítulo."],["Árvores frutíferas não abandonam sua contribuição","Oliveira, figueira e videira recusam trocar fruto por domínio.","Valorize lideranças que servem sem abandonar responsabilidades."],["O espinheiro oferece sombra perigosa","A escolha do espinheiro prenuncia destruição para quem confia nele.","Avalie líderes pelos frutos e proteja a comunidade de poder abusivo."]],"Parábola do Antigo Testamento"),
  localBibleStory("nathan-lamb","A Cordeirinha de Natã","2 Samuel 12:1–7",["cordeirinha de natan","parabola de natan","natã e o cordeiro","rico e pobre em 2 samuel"],"Natã narra a Davi a história de um rico que toma a única cordeirinha de um homem pobre para servir um visitante; Davi condena o rico antes de perceber a acusação contra si.","A parábola confronta o abuso de poder de Davi e denuncia exploração, depois do relato de seu pecado contra Urias e Bate-Seba.","Leia 2 Samuel 11–12 inteiro. A história não deve encobrir a violência real cometida contra Bate-Seba e Urias.",[["Natã escolhe uma história para confrontar o rei","O profeta apresenta um caso que desperta a indignação de Davi.","Use a narrativa para examinar abuso de poder e escutar quem foi ferido."],["A desigualdade está no centro da acusação","O rico tem muitos rebanhos e toma o único animal do pobre.","Proteja recursos e direitos de pessoas vulneráveis contra quem detém poder."],["A denúncia nomeia o responsável","Natã declara que Davi é o homem da história.","Arrependimento exige verdade, proteção das vítimas e responsabilização; não apague danos com linguagem religiosa."]],"Parábola do Antigo Testamento"),
  localBibleStory("wise-woman-tekoa","A História da Mulher de Tecoa","2 Samuel 14:1–20",["mulher de tecoa","mulher sábia de tecoa","parabola de tecoa","dois filhos e vingador do sangue"],"A pedido de Joabe, uma mulher de Tecoa conta ao rei Davi uma história sobre dois filhos e a ameaça de vingança para persuadi-lo a permitir o retorno de Absalão.","A narrativa é uma parábola forense usada politicamente para discutir o retorno de Absalão; o texto também revela as tensões e consequências da decisão.","Leia 2 Samuel 13–14. A mulher atua com estratégia e Joabe planeja a intervenção; não trate o episódio como simples modelo de reconciliação.",[["A narrativa cria um caso para o rei julgar","A mulher apresenta a perda de um filho e a ameaça contra o sobrevivente.","Observe como histórias podem iluminar uma questão e também direcionar uma decisão."],["A aplicação é conduzida por Joabe","O texto declara que Joabe instruiu a mulher a falar.","Considere interesses e poder de quem organiza uma mediação."],["O retorno não resolve sozinho o conflito","Os capítulos seguintes mostram distanciamento e novas consequências.","Não romantize reconciliações apressadas; trate segurança, verdade e reparação."]],"Parábola narrativa do Antigo Testamento"),
  localBibleStory("prophets-prisoner","O Prisioneiro que Escapou","1 Reis 20:35–43",["prisioneiro que escapou","parabola do profeta a acabe","profeta ferido e rei acabe"],"Um profeta disfarçado relata a Acabe que recebeu um prisioneiro sob ordem expressa, mas o deixou escapar; o rei pronuncia seu próprio julgamento.","A narrativa simbólica confronta Acabe por poupar Ben-Hadade apesar da palavra profética de juízo.","1 Reis 20:1–43 relata a guerra contra a Síria e a decisão de Acabe; a imagem não deve ser isolada do contexto político e profético.",[["O profeta encena um caso de responsabilidade","A história é apresentada ao rei como situação a ser julgada.","Examine decisões de líderes diante de compromissos públicos."],["O rei pronuncia a sentença","Acabe aplica ao caso a consequência que depois o confronta.","Aplique critérios com coerência, inclusive a si mesmo."],["A palavra profética aponta o contexto","O profeta explica a comparação como denúncia da decisão de Acabe.","Leia o episódio integral e diferencie a crítica profética de uma regra universal de guerra."]],"Parábola narrativa do Antigo Testamento"),
  localBibleStory("vineyard-song","A Vinha do Senhor","Isaías 5:1–7",["vinha do senhor","parabola da vinha em isaias","canção da vinha","vinha de isaias"],"Isaías canta sobre um proprietário que prepara cuidadosamente uma vinha, mas ela produz uvas bravas em vez de fruto bom.","A canção interpreta a vinha como Israel e Judá e denuncia violência e injustiça onde se esperavam direito e retidão.","Isaías 5:1–7 explica os símbolos nos versículos 7; os versículos seguintes desenvolvem acusações sociais concretas.",[["A vinha recebe cuidado e recursos","O proprietário prepara o terreno e planta videiras escolhidas.","Reconheça responsabilidades associadas aos privilégios recebidos."],["O fruto encontrado contrasta com a expectativa","Em vez de justiça e retidão aparecem violência e clamor.","Avalie a vida comunitária por seus efeitos sobre pessoas vulneráveis."],["A imagem é interpretada pelo próprio profeta","Isaías 5:7 nomeia a casa de Israel e Judá e explica o contraste.","Aplique a crítica a práticas e instituições, não como insulto contra um povo."]],"Parábola/canção profética do Antigo Testamento"),
  localBibleStory("two-eagles-vine","As Duas Águias e a Videira","Ezequiel 17:1–24",["duas aguias e a videira","duas águias","videira de ezequiel","parabola das aguias"],"Ezequiel conta uma alegoria de duas grandes águias e uma videira para interpretar alianças e a infidelidade política de Jerusalém.","A alegoria critica a ruptura do juramento feito à Babilônia e anuncia que Deus plantará um cedro sob o qual haverá abrigo.","Ezequiel 17:11–21 interpreta a alegoria no contexto da política de Judá; os versículos 22–24 acrescentam uma promessa de restauração.",[["Leia a imagem antes da explicação","Ezequiel 17:1–10 apresenta águias, cedro e videira.","Separe os símbolos da interpretação para acompanhar o argumento."],["A explicação nomeia reis e alianças","Ezequiel 17:11–21 aplica a imagem à decisão de Jerusalém.","Estude o cenário histórico antes de fazer aplicações políticas atuais."],["A palavra final inclui esperança","Ezequiel 17:22–24 fala do ramo plantado por Deus.","Leia denúncia e esperança juntas sem prometer um resultado imediato para qualquer governo."]],"Alegoria profética do Antigo Testamento"),
  localBibleStory("useless-vine","A Videira Inútil","Ezequiel 15:1–8",["videira inutil","videira inútil","madeira da videira","parabola da videira em ezequiel"],"Ezequiel pergunta que utilidade tem a madeira da videira quando não produz uvas e a compara à madeira queimada.","A imagem anuncia juízo sobre Jerusalém no contexto da infidelidade da cidade.","Ezequiel 15 é um oráculo breve dirigido a Jerusalém; trate-o como palavra profética de juízo, não como uma regra sobre valor individual.",[["A imagem parte da finalidade da videira","A madeira é comparada com árvores úteis para construção.","Pergunte que finalidade o texto atribui à imagem antes de aplicá-la."],["O profeta dirige a figura a Jerusalém","Os versículos 6–8 explicam o alvo do oráculo.","Mantenha a interpretação histórica em vista e evite condenações individuais."],["O juízo é situado numa aliança rompida","O texto relaciona a imagem à infidelidade da cidade.","Leia junto de outras palavras proféticas sobre responsabilidade e restauração."]],"Alegoria profética do Antigo Testamento"),
  localBibleStory("lioness-cubs","A Leoa e os Leõezinhos","Ezequiel 19:1–14",["leoa e leõezinhos","leoa de israel","parabola dos leoes em ezequiel","lamentação pelos príncipes"],"Ezequiel compõe uma lamentação poética sobre uma leoa e seus filhotes, imagens ligadas aos governantes de Judá levados ao exílio.","O poema lamenta a perda dos governantes e a devastação política que culmina na queda de Jerusalém.","Ezequiel 19 se identifica como lamentação; leia os símbolos no contexto do exílio e da crítica à liderança.",[["O gênero é uma lamentação","Ezequiel 19:1 apresenta o poema como lamento pelos príncipes de Israel.","Reconheça a dor política do texto em vez de transformá-lo em fábula infantil."],["Os filhotes representam governantes","O poema fala de captura, exílio e destruição.","Avalie as consequências de lideranças violentas e das decisões imperiais."],["A videira encerra a imagem de perda","Ezequiel 19:10–14 descreve a videira arrancada e levada ao deserto.","Leia a passagem como memória de devastação e responsabilidade histórica."]],"Alegoria profética do Antigo Testamento")
);
function findLocalBibleStory(raw){const text=localNormalizeSermon(raw||'').replace(/[^a-z0-9]+/g,' ').trim();if(!text)return null;let best=null,score=0;for(const story of LOCAL_BIBLE_STORIES)for(const alias of [story.titulo,...story.aliases]){const key=localNormalizeSermon(alias).replace(/[^a-z0-9]+/g,' ').trim();if(key&&text.includes(key)&&key.length>score){best=story;score=key.length}}return score>=5?best:null}
function buildLocalBibleStoryDraft(story,request={}){if(!story)return null;const audience=request.aud||'a comunidade',duration=Math.min(240,Math.max(5,Number(request.duration)||30)),topics=story.topicos.map((point,index)=>({title:(index+1)+'. '+point.titulo,development:'**Exegese:** '+point.exegese+'\n\n**Aplicação prática:** '+point.aplicacao}));const d={title:story.titulo,subtitle:'Esboço criado com notas bíblicas incluídas no aplicativo; esta geração não consultou API nem fonte externa.',theme:story.titulo,text:story.referencia,type:request.type||'Expositiva',duration,aud:audience,goal:story.lição,intro:'Leia '+story.referencia+' e apresente a pergunta: o que esta narrativa revela sobre Deus, as pessoas e a resposta de fé? '+story.resumo,ctx:story.contexto,topics,refs:story.referencia+' — leia a unidade completa e confira o contexto na tradução usada pela sua comunidade.',ill:'Se usar uma ilustração, identifique-a como exemplo contemporâneo; ela deve esclarecer o ponto sem ser apresentada como parte da história bíblica.',app:'Convide '+audience+' a escolher uma resposta prática coerente com a passagem. Evite promessas que o texto não faz, culpa indevida ou pressão.',concl:'Retome a ideia central e os três movimentos da narrativa: '+story.lição,appeal:'Faça um convite pastoral claro e respeitoso, com liberdade e um próximo passo possível.',sourceMode:'biblioteca bíblica local',localStoryId:story.id,onlineSources:[]};d.researchMarkdown=chatDraftMarkdown(d);return d}
window.PR_LOCAL_BIBLE_STORIES=LOCAL_BIBLE_STORIES;

function renderChatMarkdown(value){
